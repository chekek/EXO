// ---------- константы ----------
const TS=16, VW=480, VH=270;
const GRAV=.34, JUMPV=-5.9, MAXVX=1.75, ACC=.28, FRIC=.3, MAXFALL=6.5;

// ---------- утилиты ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>13))*1274126177|0;return ((h^(h>>16))>>>0)/4294967295;}
const pad=(n,l)=>String(n).padStart(l,'0');

// ---------- аудио (полностью процедурный синтез) ----------
const SFX={ctx:null,master:null,on:true,humG:null,
  init(){ if(this.ctx)return; try{
    const C=this.ctx=new (window.AudioContext||window.webkitAudioContext)();
    this.master=C.createGain(); this.master.gain.value=.55; this.master.connect(C.destination);
    // фоновый гул завода
    const g=this.humG=C.createGain(); g.gain.value=.05; g.connect(this.master);
    const lp=C.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=160; lp.connect(g);
    [52,104.7].forEach((f,i)=>{const o=C.createOscillator();o.type=i?'triangle':'sawtooth';o.frequency.value=f;
      const og=C.createGain();og.gain.value=i?.25:.6;o.connect(og);og.connect(lp);o.start();});
    const lfo=C.createOscillator();lfo.frequency.value=.11;const lg=C.createGain();lg.gain.value=.02;
    lfo.connect(lg);lg.connect(g.gain);lfo.start();
    // шум вентиляции
    const nb=C.createBuffer(1,C.sampleRate*2,C.sampleRate),d=nb.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const ns=C.createBufferSource();ns.buffer=nb;ns.loop=true;
    const bp=C.createBiquadFilter();bp.type='bandpass';bp.frequency.value=280;bp.Q.value=.6;
    const ng=C.createGain();ng.gain.value=.014;ns.connect(bp);bp.connect(ng);ng.connect(this.master);ns.start();
  }catch(e){} },
  t(f0,f1,dur,type,vol,delay=0){ if(!this.ctx||!this.on)return; const C=this.ctx,t0=C.currentTime+delay;
    const o=C.createOscillator(),g=C.createGain();o.type=type||'square';
    o.frequency.setValueAtTime(f0,t0); o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
    g.gain.setValueAtTime(vol,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g);g.connect(this.master);o.start(t0);o.stop(t0+dur+.02); },
  n(dur,f,q,vol,delay=0){ if(!this.ctx||!this.on)return; const C=this.ctx,t0=C.currentTime+delay;
    const b=C.createBuffer(1,C.sampleRate*dur,C.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s=C.createBufferSource();s.buffer=b;
    const bp=C.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q;
    const g=C.createGain();g.gain.value=vol;s.connect(bp);bp.connect(g);g.connect(this.master);s.start(t0); },
  jump(){this.t(170,330,.12,'square',.10)},
  land(){this.n(.08,300,1,.12)},
  step(){this.n(.045,900,2,.05)},
  plate(){this.t(880,880,.04,'square',.09);this.t(140,90,.1,'triangle',.12)},
  door(o){this.n(.45,o?400:700,1.2,.14);this.t(o?70:120,o?130:60,.45,'sawtooth',.05)},
  recOn(){this.t(500,1200,.18,'square',.08);this.t(1200,1200,.06,'sine',.06,.16)},
  recBeep(){this.t(1100,1100,.05,'sine',.045)},
  echo(){this.t(1400,300,.3,'sine',.09);this.n(.25,2000,3,.06)},
  echoDie(){for(let i=0;i<5;i++)this.t(200+Math.random()*900,100,.06,'square',.06,i*.03)},
  coil(){this.t(880,880,.09,'sine',.10);this.t(1318,1318,.14,'sine',.08,.07)},
  pulse(){this.t(660,660,.09,'square',.1);this.t(660,660,.09,'square',.1,.14);this.t(880,880,.2,'square',.1,.28)},
  death(){this.t(300,40,.5,'sawtooth',.16);this.n(.4,500,.5,.2)},
  win(){[294,440,587].forEach((f,i)=>this.t(f,f,.22,'triangle',.12,i*.13))},
  deny(){this.t(200,150,.12,'square',.08)}
};

// ---------- ввод ----------
const Keys={},JP=new Set();
const MAP={ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R',ArrowUp:'J',KeyW:'J',Space:'J',
  KeyE:'E',KeyQ:'Q',KeyR:'RS',KeyM:'M',Escape:'ESC',Enter:'OK',ArrowDown:'D'};
addEventListener('keydown',e=>{const k=MAP[e.code];if(k){if(!Keys[k])JP.add(k);Keys[k]=1;e.preventDefault();}SFX.init();});
addEventListener('keyup',e=>{const k=MAP[e.code];if(k)Keys[k]=0;});
addEventListener('blur',()=>{for(const k in Keys)Keys[k]=0;if(G.state==='play')G.paused=true;});
// touch
const isTouch=('ontouchstart' in window);
if(isTouch)document.getElementById('touch').style.display='block';
[['tL','L'],['tR','R'],['tJ','J'],['tE','E'],['tQ','Q']].forEach(([id,k])=>{
  const el=document.getElementById(id);
  el.addEventListener('pointerdown',e=>{e.preventDefault();SFX.init();if(!Keys[k])JP.add(k);Keys[k]=1;});
  el.addEventListener('pointerup',()=>Keys[k]=0);
  el.addEventListener('pointerleave',()=>Keys[k]=0);
});
document.getElementById('stage').addEventListener('pointerdown',e=>{SFX.init();
  if(G.state!=='play'&&!e.target.classList.contains('tb'))JP.add('OK');});

function drawDude(g,x,y,fr,face,pal,alpha){
  g.save();g.globalAlpha=alpha;
  const sp=DUDE[fr]||DUDE.idle;
  for(let r=0;r<sp.length;r++)for(let c=0;c<8;c++){
    const ch=sp[r][c]; if(ch==='.')continue;
    g.fillStyle=pal[ch]; g.fillRect(x+(face<0?7-c:c),y+r,1,1);
  }
  g.restore();
}

// ---------- парсинг уровня ----------
const G={state:'title',lvlIdx:0,sel:0,t:0,lt:0,deaths:0,playT:0,paused:false,
  save:null,lvl:null,echoes:[],parts:[],dust:[],msg:null,msgT:0,
  wipe:0,wipeDir:0,shake:0,glitch:0,winT:0,finalText:'',finalShown:0};
try{G.save=JSON.parse(localStorage.getItem('echo9')||'{"unlocked":0,"coils":[],"deaths":0,"time":0}');}catch(e){G.save={unlocked:0,coils:[],deaths":0]};}
if(!G.save.coils)G.save.coils=[];

function loadLevel(i){
  const def=LEVELS[i];
  const rows=def.map.map(r=>r);
  const H=rows.length, W=Math.max(...rows.map(r=>r.length));
  const grid=rows.map(r=>r.padEnd(W,'.'));
  const L={def,W,H,grid,doors:[],plates:[],coils:[],spikes:[],acid:[],noise:[],
    platforms:[],lamps:[],echoLimit:def.echo,dark:!!def.dark,ch4t:0,
    spawn:{x:32,y:32},exit:null,coilsGot:0,totalCoils:0,doorCh:{}};
  // двери: вертикальные группы
  for(let x=0;x<W;x++){let y=0;
    while(y<H){ const ch=grid[y][x];
      if('ABCD'.includes(ch)){ let y0=y; while(y<H&&grid[y][x]===ch)y++;
        L.doors.push({ch:ch.charCodeAt(0)-64,x,y0,y1:y-1,open:0,closing:false,prevOpen:0});
      } else y++;
    }}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const ch=grid[y][x];
    if('1234'.includes(ch))L.plates.push({ch:+ch,x,y,press:0,wasP:0,anim:0});
    else if(ch==='o'){L.coils.push({x,y,taken:false,ph:hash(x,y)*7});L.totalCoils++;}
    else if(ch==='^')L.spikes.push({x,y});
    else if(ch==='~')L.acid.push({x,y,top:!(y>0&&grid[y-1][x]==='~')});
    else if(ch==='@')L.noise.push({x,y});
    else if(ch==='P')L.spawn={x:x*TS+4,y:y*TS+TS-P_H};
    else if(ch==='F')L.exit={x,y};
    else if(ch==='*')L.platforms.push({cx:x,cy:y,w:TS*3,h:8,ph:hash(x,y)*6.28,
      py:y*TS,ppy:y*TS,dx:0,dy:0,rope:0});
  }
  // трос лифта: до потолка
  L.platforms.forEach(p=>{let y=p.cy;while(y>0&&grid[y-1][p.cx]!=='#')y--;p.rope=(p.cy-y)*TS;});
  // лампы: каждые N колонок — над полом
  const step=def.dark?13:6;
  for(let x=3;x<W;x+=step+((hash(x,7)*3)|0)){
    let fl=-1;for(let y=H-1;y>=2;y--){const c=grid[y][x],u=grid[y-1][x];
      if(c!=='.'&&!'ABCD1234oP*F@^~='.includes(c)&&u==='.'){fl=y;break;}
      if(c==='~'||c==='^')break; if(c!=='.'&&u!=='.')break;}
    if(fl>0){const ly=Math.max(1,fl-6);
      L.lamps.push({x:x*TS+8,y:ly*TS,red:def.dark&&hash(x,99)>.55,seed:hash(x,3)});}
  }
  G.lvl=L; G.echoes=[]; G.parts=[]; G.lt=0; G.winT=0;
  G.player={x:L.spawn.x,y:L.spawn.y,vx:0,vy:0,face:1,ground:false,coyote:0,jbuf:0,
    animT:0,onPlat:null,dead:false,deadT:0,stepT:0};
  G.rec={active:false,frames:[],tick:0,beep:0};
  G.cam={x:0,y:0}; L.ch4t=0;
  buildCache(); makeDust();
  msg(def.hint,360);
}
function solidT(tx,ty){ const L=G.lvl;
  if(tx<0||tx>=L.W)return '#';
  if(ty<0)return '#'; if(ty>=L.H)return '.';
  const c=L.grid[ty][tx]; return c==='#'?c:'.'; }
const isSolidPx=(px,py)=>solidT(Math.floor(px/TS),Math.floor(py/TS))==='#';

// ---------- физика ----------
function tileCollide(e){
  // ось X
  e.x+=e.vx;
  let y0=Math.floor(e.y/TS),y1=Math.floor((e.y+e.h-1)/TS);
  if(e.vx>0){const tx=Math.floor((e.x+e.w)/TS);
    for(let ty=y0;ty<=y1;ty++)if(solidT(tx,ty)==='#'){e.x=tx*TS-e.w-0.01;e.vx=0;break;}}
  else if(e.vx<0){const tx=Math.floor(e.x/TS);
    for(let ty=y0;ty<=y1;ty++)if(solidT(tx,ty)==='#'){e.x=(tx+1)*TS+0.01;e.vx=0;break;}}
  // двери по X
  for(const d of G.lvl.doors){const r=doorRect(d);
    if(overlap(e,r)){ if(e.vx>0)e.x=r.x-e.w-0.01; else if(e.vx<0)e.x=r.x+r.w+0.01; e.vx=0; }}
  // ось Y
  const prevB=e.y+e.h;
  e.y+=e.vy; e.ground=false; e.onPlat=null;
  const x0=Math.floor((e.x+1)/TS),x1=Math.floor((e.x+e.w-1)/TS);
  if(e.vy>0){const ty=Math.floor((e.y+e.h)/TS);
    for(let tx=x0;tx<=x1;tx++){
      if(solidT(tx,ty)==='#'|| (prevB<=ty*TS+0.01 && G.lvl.grid[ty] && G.lvl.grid[ty][tx]==='=')){
        e.y=ty*TS-e.h; e.vy=0; e.ground=true; break; }}}
  else if(e.vy<0){const ty=Math.floor(e.y/TS);
    for(let tx=x0;tx<=x1;tx++)if(solidT(tx,ty)==='#'){e.y=(ty+1)*TS+0.01;e.vy=0;break;}}
  // двери по Y
  for(const d of G.lvl.doors){const r=doorRect(d);
    if(overlap(e,r)){ if(e.vy>=0 && e.y+e.h/2<r.y+r.h/2){e.y=r.y-e.h;e.vy=0;e.ground=true;}
      else {e.y=r.y+r.h+0.01;e.vy=0;} }}
  // платформы (сверху)
  if(e.vy>=0)for(const p of G.lvl.platforms){
    const top=p.py;
    if(e.x+e.w>p.cx*TS-p.w/2 && e.x<p.cx*TS+p.w/2 &&
       prevB<=top+2.5 && e.y+e.h>=top){ e.y=top-e.h;e.vy=0;e.ground=true;e.onPlat=p; }}
}
const overlap=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function doorRect(d){const full=(d.y1-d.y0+1)*TS,h=full*(1-d.open);
  return {x:d.x*TS+3,y:(d.y1+1)*TS-h,w:10,h};}

// ---------- запись и эхо ----------
function startRec(){
  const P=G.player,L=G.lvl;
  if(G.echoes.length>=L.echoLimit){msg('КАНАЛЫ ЭХО ЗАНЯТЫ · Q — ОЧИСТИТЬ',150);SFX.deny();return;}
  if(inNoise(P)){msg('ПОМЕХИ: ЗАПИСЬ НЕВОЗМОЖНА',150);SFX.deny();return;}
  G.rec={active:true,frames:[],tick:0,beep:0}; SFX.recOn();
}
function stopRec(cancel){
  const R=G.rec;
  if(R.active&&R.frames.length>10&&!cancel){
    const f=R.frames;
    G.echoes.push({frames:f,t:0,playing:true,frozen:false,dieT:0,x:f[0].x,y:f[0].y,
      face:f[0].fc,fr:'idle'});
    SFX.echo(); burst(f[0].x+4,f[0].y+6,'#7df3e8',18);
    msg('ЭХО ЗАПИСАНО · КАНАЛ '+(G.echoes.length),120);
  }
  G.rec={active:false,frames:[],tick:0,beep:0};
}
function inNoise(e){const L=G.lvl;
  const pts=[[e.x+1,e.y+3],[e.x+e.w-1,e.y+3],[e.x+1,e.y+e.h-1],[e.x+e.w-1,e.y+e.h-1]];
  return pts.some(([px,py])=>{const tx=Math.floor(px/TS),ty=Math.floor(py/TS);
    return ty>=0&&ty<L.H&&tx>=0&&tx<L.W&&L.grid[ty][tx]==='@';});}

function stepEchoes(){
  const L=G.lvl;
  for(const e of G.echoes){ if(e.dieT)continue;
    if(e.playing){ e.t+=0.5;
      const i=Math.floor(e.t),f=e.t-i;
      const a=e.frames[i],b=e.frames[Math.min(i+1,e.frames.length-1)];
      e.x=lerp(a.x,b.x,f); e.y=lerp(a.y,b.y,f); e.face=b.fc; e.fr=b.fr;
      if(G.lt%3===0)G.parts.push({x:e.x+4,y:e.y+6,vx:(Math.random()-.5)*.3,vy:-.15,life:22,c:'#7df3e8',s:1,g:0});
      if(e.t>=e.frames.length-1){e.playing=false;e.frozen=true;}
    }
    // гибель эхо: шипы, кислота, дверь
    const box={x:e.x,y:e.y,w:P_W,h:P_H};
    if(G.lt%4===0){
      for(const s of L.spikes)if(overlap(box,{x:s.x*TS+2,y:s.y*TS+6,w:12,h:10})){echoDie(e);break;}
      const cx=e.x+4,cy=e.y+e.h-2,tx=Math.floor(cx/TS),ty=Math.floor(cy/TS);
      if(ty>=0&&ty<L.H&&tx>=0&&tx<L.W&&L.grid[ty][tx]==='~')echoDie(e);
    }
    for(const d of L.doors){const r=doorRect(d);
      if(d.closing&&overlap(box,r)){echoDie(e);break;}}
  }
  G.echoes=G.echoes.filter(e=>!e.dieT||e.dieT<22);
  for(const e of G.echoes)if(e.dieT)e.dieT++;
}
function echoDie(e){ if(e.dieT)return; e.dieT=1; SFX.echoDie(); burst(e.x+4,e.y+6,'#7df3e8',26); }
function clearEchoes(){ if(!G.echoes.length&&!G.rec.active)return;
  G.echoes.forEach(e=>{if(!e.dieT){e.dieT=1;burst(e.x+4,e.y+6,'#7df3e8',14);}});
  if(G.rec.active)stopRec(true);
  SFX.echoDie(); msg('ЭХО СТЁРТЫ',100); }

// ---------- шаг игры ----------
function step(){
  G.t++;
  if(G.state==='play'&&!G.paused){
    G.playT++; G.lt++;
    stepPlay();
  } else if(G.state==='wipe'){ G.wipe+=G.wipeDir*0.045;
    if(G.wipeDir>0&&G.wipe>=1){G.wipe=1;G.wipeDir=0;afterWipe();}
    else if(G.wipeDir<0&&G.wipe<=0){G.wipe=0;G.wipeDir=0;}
  }
  stepParts();
  JPclear();
}
function JPclear(){JP.clear();}

function stepPlay(){
  const L=G.lvl,P=G.player;
  if(P.dead){ P.deadT++;
    if(P.deadT>80){P.dead=false;P.x=L.spawn.x;P.y=L.spawn.y;P.vx=P.vy=0;
      G.cam.x=clamp(P.x-VW/2,0,Math.max(0,L.W*TS-VW));
      G.cam.y=camY(P.y);} return; }
  if(G.winT){ G.winT++;
    if(G.winT===10)SFX.win();
    if(G.winT>62)startWipe(); return; }
  // движение
  const dir=(Keys.R?1:0)-(Keys.L?1:0);
  if(dir!==0){P.vx=clamp(P.vx+dir*ACC,-MAXVX,MAXVX);P.face=dir;}
  else{const f=P.ground?FRIC:.08;P.vx=Math.abs(P.vx)<f?0:P.vx-Math.sign(P.vx)*f;}
  if(P.ground)P.coyote=8;else if(P.coyote>0)P.coyote--;
  if(JP.has('J'))P.jbuf=8;else if(P.jbuf>0)P.jbuf--;
  if(P.jbuf>0&&P.coyote>0){P.vy=JUMPV;P.coyote=0;P.jbuf=0;SFX.jump();}
  if(!Keys.J&&P.vy<-2)P.vy=-2;
  P.vy=Math.min(P.vy+GRAV,MAXFALL);
  // перенос платформой
  if(P.onPlat){const p=P.onPlat;
    if(P.x+P.w>p.cx*TS-p.w/2&&P.x<p.cx*TS+p.w/2&&Math.abs(P.y+P.h-p.py)<4){
      P.x+=p.dx;P.y+=p.dy;} else P.onPlat=null;}
  const wasG=P.ground, wasVy=P.vy;
  tileCollide(P);
  if(P.ground&&!wasG&&wasVy>2.5){SFX.land();G.shake=Math.min(3,wasVy*.5);
    for(let i=0;i<5;i++)G.parts.push({x:P.x+Math.random()*8,y:P.y+P_H,vx:(Math.random()-.5),vy:-Math.random()*.5,life:14,c:'#8a8578',s:1,g:.02});}
  // шаги
  if(P.ground&&Math.abs(P.vx)>.6){P.stepT++;if(P.stepT>13){P.stepT=0;SFX.step();}}
  // анимация
  P.animT+=Math.abs(P.vx);
  // границы и бездна
  if(P.y>L.H*TS+80)killPlayer();
  // запись
  if(JP.has('E')){ if(!G.rec.active)startRec(); else stopRec(false); }
  if(JP.has('Q'))clearEchoes();
  if(JP.has('RS')){loadLevel(G.lvlIdx);msg('СЕКТОР ПЕРЕЗАПУЩЕН',120);return;}
  if(JP.has('ESC')){G.paused=true;return;}
  if(JP.has('M')){SFX.on=!SFX.on;msg(SFX.on?'ЗВУК: ВКЛ':'ЗВУК: ВЫКЛ',90);}
  if(G.rec.active){
    G.rec.tick++;
    if(G.rec.tick>=2){G.rec.tick=0;G.rec.frames.push({x:P.x,y:P.y,fc:P.face,
      fr:!P.ground?'jump':(Math.abs(P.vx)>.5?(Math.floor(P.animT/6)%2?'runA':'runB'):'idle')});
      if(G.rec.frames.length>=REC_MAX)stopRec(false);}
    G.rec.beep++; if(G.rec.beep>45){G.rec.beep=0;SFX.recBeep();}
    if(inNoise(P)){msg('ЗАПИСЬ ПРЕРВАНА ПОМЕХАМИ',130);stopRec(false);}
  }
  // платформы
  for(const p of L.platforms){ p.ppy=p.py;
    p.py=p.cy*TS+Math.sin(G.lt*0.02+p.ph)*TS*3;
    p.dx=0;p.dy=p.py-p.ppy; }
  // плиты и каналы
  let ch=[false,false,false,false];
  for(const pl of L.plates){ pl.wasP=pl.press; pl.press=0;
    const r={x:pl.x*TS+2,y:pl.y*TS+9,w:12,h:7};
    const ents=[P,...G.echoes.filter(e=>!e.dieT)].map(e=>({x:e.x,y:e.y,w:P_W,h:P_H}));
    for(const e of ents)if(overlap(e,r))pl.press=1;
    pl.anim+=((pl.press?1:0)-pl.anim)*.3;
    if(pl.press&&!pl.wasP){SFX.plate();
      if(pl.ch===4){L.ch4t=PULSE_T;SFX.pulse();msg('ИМПУЛЬС: ШЛЮЗ-4 ОТКРЫТ',100);}}
    if(pl.ch===4){ if(pl.press&&!pl.wasP)L.ch4t=PULSE_T; }
    else if(pl.press)ch[pl.ch-1]=true;
  }
  if(L.ch4t>0){L.ch4t--;ch[3]=true;}
  // двери
  for(const d of L.doors){
    const target=ch[d.ch-1]?1:0; d.prevOpen=d.open;
    d.open=target>d.open?Math.min(d.open+.07,1):Math.max(d.open-.015,target);
    d.closing=d.open<d.prevOpen-1e-9;
    const r=doorRect(d);
    if(d.closing){
      if(!P.dead&&overlap({x:P.x,y:P.y,w:P_W,h:P_H},r))killPlayer();
      for(const e of G.echoes)if(!e.dieT&&overlap({x:e.x,y:e.y,w:P_W,h:P_H},r))echoDie(e);
    }
    if((d.open>0.02)!==(d.prevOpen>0.02))SFX.door(d.open>0.02);
  }
  // эхо
  stepEchoes();
  // катушки
  for(const c of L.coils){ if(c.taken)continue;
    if(overlap({x:P.x,y:P.y,w:P_W,h:P_H},{x:c.x*TS+2,y:c.y*TS+2,w:12,h:12})){
      c.taken=true;L.coilsGot++;SFX.coil();burst(c.x*TS+8,c.y*TS+8,'#ffcf7a',14);
      msg('КАТУШКА '+L.coilsGot+' / '+L.totalCoils,90);}}
  // шипы и кислота — игрок
  if(!P.dead){
    const box={x:P.x+1,y:P.y+2,w:P_W-2,h:P_H-2};
    for(const s of L.spikes)if(overlap(box,{x:s.x*TS+2,y:s.y*TS+6,w:12,h:10})){killPlayer();break;}
    const tx=Math.floor((P.x+4)/TS),ty=Math.floor((P.y+P_H-2)/TS);
    if(ty>=0&&ty<L.H&&tx>=0&&tx<L.W&&L.grid[ty][tx]==='~')killPlayer();
  }
  // выход
  if(L.exit&&!G.winT&&overlap({x:P.x,y:P.y,w:P_W,h:P_H},{x:L.exit.x*TS-4,y:L.exit.y*TS-8,w:24,h:24})){
    G.winT=1; if(G.rec.active)stopRec(false);
    burst(P.x+4,P.y+6,'#ffd27a',20);
  }
  // камера
  const tx=P.x+P.face*26-VW/2, ty=camY(P.y);
  G.cam.x=lerp(G.cam.x,clamp(tx,0,Math.max(0,L.W*TS-VW)),.1);
  G.cam.y=lerp(G.cam.y,ty,.12);
  if(G.shake>0)G.shake*=.85;
  if(G.glitch>0)G.glitch--;
  // пыль у ламп
  if(G.lt%9===0){const L2=G.lvl;
    if(L2.lamps.length&&Math.random()<.6){const lp=L2.lamps[(Math.random()*L2.lamps.length)|0];
      G.parts.push({x:lp.x+(Math.random()-.5)*30,y:lp.y+Math.random()*40,vx:(Math.random()-.5)*.12,vy:.06+Math.random()*.05,life:120,c:'dust',s:1,g:0});}}
  // пузыри кислоты
  if(G.lt%14===0){const acids=L.acid.filter(a=>a.top);
    if(acids.length){const a=acids[(Math.random()*acids.length)|0];
      G.parts.push({x:a.x*TS+Math.random()*16,y:a.y*TS+13,vx:0,vy:-.25-Math.random()*.2,life:40,c:'#9fe08a',s:1,g:0});}}
}
function camY(py){const L=G.lvl,worldH=L.H*TS;
  if(worldH<=VH)return -(VH-worldH)/2;
  return clamp(py-VH*.55,0,worldH-VH);}
function killPlayer(){const P=G.player; if(P.dead||G.winT)return;
  P.dead=true;P.deadT=0;G.deaths++;G.save.deaths++;G.glitch=50;G.shake=5;SFX.death();
  if(G.rec.active)stopRec(true);

function buildCache(){
  const L=G.lvl; if(!L)return;
  lcv.width=L.W*TS; lcv.height=L.H*TS;
  const g=lctx; g.clearRect(0,0,lcv.width,lcv.height);
  for(let y=0;y<L.H;y++)for(let x=0;x<L.W;x++){
    const ch=L.grid[y][x],px=x*TS,py=y*TS;
    if(ch==='#'){
      const openTop=y>0?L.grid[y-1][x]!=='#':true;
      if(openTop){ // кафельный пол / верхняя кромка
        g.fillStyle='#6f8b86'; g.fillRect(px,py,TS,TS);
        g.fillStyle='#799691';
        g.fillRect(px+1,py+1,6,6); g.fillRect(px+9,py+1,6,6);
        g.fillRect(px+1,py+9,6,6); g.fillRect(px+9,py+9,6,6);
        g.fillStyle='#546d69';
        g.fillRect(px+7,py,1,TS); g.fillRect(px,py+7,TS,1);
        g.fillStyle='#93b0aa'; g.fillRect(px,py,TS,2);
        if(hash(x,y)>.6){g.fillStyle='#5c736f';g.fillRect(px+((hash(x,y*3)*10)|0)+2,py+((hash(x*3,y)*10)|0)+2,3,2);}
        if(hash(x*2,y)>.87){ // предупреждающая кромка
          for(let i=0;i<4;i++){g.fillStyle=i%2?'#c9a13b':'#2c2c28';g.fillRect(px+i*4,py,4,3);}}
      } else { // бетонная толща
        g.fillStyle='#4c4a45'; g.fillRect(px,py,TS,TS);
        for(let i=0;i<5;i++){const h1=hash(x*31+i,y*17+i);
          g.fillStyle=h1>.5?'#54524c':'#44423d';
          g.fillRect(px+((h1*13)|0),py+((hash(x+i,y*7+i)*13)|0),2,2);}
        if(y+1>=L.H||L.grid[y+1][x]!=='#'){g.fillStyle='#33322e';g.fillRect(px,py+TS-2,TS,2);
          if(hash(x,y*5)>.7){g.fillStyle='#3a3833';g.fillRect(px+6,py+TS-2,2,4);}}
        if(x>0&&L.grid[y][x-1]!=='#'){g.fillStyle='#5a5852';g.fillRect(px,py,2,TS);}
        if(x+1<L.W&&L.grid[y][x+1]!=='#'){g.fillStyle='#3b3a36';g.fillRect(px+TS-2,py,2,TS);}
        if(hash(x*7,y*3)>.94){g.fillStyle='rgba(107,138,96,.5)';g.fillRect(px+2,py+9,12,4);} // советская зелёная краска
      }
    } else if(ch==='='){ // решётка
      g.fillStyle='#6d747c'; g.fillRect(px,py,TS,5);
      g.fillStyle='#494f55'; for(let i=0;i<4;i++)g.fillRect(px+2+i*4,py+1,2,3);
      g.fillStyle='#8b939b'; g.fillRect(px,py,TS,1);
      g.fillStyle='#3c4147'; g.fillRect(px,py+5,TS,1);
    } else if(ch==='^'){ // шипы
      g.fillStyle='#23262b'; g.fillRect(px,py+13,TS,3);
      for(let i=0;i<4;i++){const sx=px+i*4;
        g.fillStyle='#9aa3a8';
        g.beginPath();g.moveTo(sx,py+16);g.lineTo(sx+2,py+6);g.lineTo(sx+4,py+16);g.closePath();g.fill();
        g.fillStyle='#c8d0d4';g.fillRect(sx+1,py+9,1,4);}
    }
  }
  // трафаретные надписи
  if(L.def.signs)for(const s of L.def.signs){
    g.save(); g.globalAlpha=.62; g.font='7px "IBM Plex Mono",monospace';
    g.fillStyle=hash(s.x,s.y)>.5?'#c24b3a':'#b9b3a4';
    g.fillText(s.t,s.x*TS,s.y*TS); g.restore();
  }
}

}

}
function drawFan(x,y,k){
  ctx.save();ctx.translate(x,y);
  ctx.fillStyle='#12161a';ctx.beginPath();ctx.arc(0,0,26,0,7);ctx.fill();
  ctx.save();ctx.rotate(G.t*.05);
  ctx.fillStyle='#1c2227';
  for(let i=0;i<4;i++){ctx.rotate(Math.PI/2);ctx.fillRect(-3,-24,6,22);}
  ctx.restore();
  ctx.strokeStyle='#242b31';ctx.lineWidth=3;ctx.beginPath();ctx.arc(0,0,26,0,7);ctx.stroke();
  ctx.strokeStyle='#171c20';ctx.lineWidth=1;
  for(let i=0;i<3;i++){const a=i*1.05;ctx.beginPath();ctx.moveTo(-Math.cos(a)*26,-Math.sin(a)*26);ctx.lineTo(Math.cos(a)*26,Math.sin(a)*26);ctx.stroke();}
  ctx.restore();
}

function drawLight(camX,camY){
  const L=G.lvl, amb=L.dark?.93:.42;
  lctx.clearRect(0,0,VW,VH);
  lctx.globalCompositeOperation='source-over';
  lctx.fillStyle=`rgba(3,5,9,${amb})`; lctx.fillRect(0,0,VW,VH);
  lctx.globalCompositeOperation='destination-out';
  const cut=(wx,wy,r,s)=>{const x=wx-camX,y=wy-camY;
    if(x<-r||x>VW+r||y<-r||y>VH+r)return;
    const g=lctx.createRadialGradient(x,y,2,x,y,r);
    g.addColorStop(0,`rgba(0,0,0,${s})`);g.addColorStop(1,'rgba(0,0,0,0)');
    lctx.fillStyle=g;lctx.beginPath();lctx.arc(x,y,r,0,7);lctx.fill();};
  for(const lp of L.lamps){
    const fl=.85+.15*Math.sin(G.t*.13+lp.seed*20)+(Math.random()<.01?-.4:0);
    cut(lp.x,lp.y+6,lp.red?40:66*fl,lp.red?.8:.95);}
  const P=G.player;
  if(!P.dead)cut(P.x+4,P.y+6,L.dark?52:60,.95);
  for(const e of G.echoes)if(!e.dieT)cut(e.x+4,e.y+6,38,.9);
  for(const c of L.coils)if(!c.taken)cut(c.x*TS+8,c.y*TS+8,22,.8);
  if(L.exit)cut(L.exit.x*TS+8,L.exit.y*TS+2,30,.85);
  ctx.drawImage(lcv,0,0);
  // тёплые блики
  ctx.save(); ctx.translate(-Math.round(camX),-Math.round(camY));
  ctx.globalCompositeOperation='lighter';
  const glow=(wx,wy,r,c)=>{const x=wx-Math.round(camX),y=wy-Math.round(camY);
    if(x<-r||x>VW+r||y<-r||y>VH+r)return;
    const g=ctx.createRadialGradient(x,y,1,x,y,r);
    g.addColorStop(0,c);g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();};
  for(const lp of L.lamps){
    const f=.7+.3*Math.sin(G.t*.13+lp.seed*20);
    glow(lp.x,lp.y+5,26,lp.red?`rgba(255,60,45,${.16*f})`:`rgba(255,190,110,${.14*f})`);
    ctx.fillStyle=lp.red?'#ff5a45':'#ffd9a0'; ctx.fillRect(lp.x-2,lp.y,4,5);
    ctx.fillStyle='#2c3136'; ctx.fillRect(lp.x-4,lp.y-2,8,3);}
  for(const c of L.coils)if(!c.taken)glow(c.x*TS+8,c.y*TS+8,14,'rgba(255,200,90,.22)');
  for(const e of G.echoes)if(!e.dieT)glow(e.x+4,e.y+6,16,'rgba(110,240,230,.16)');
  if(L.exit)glow(L.exit.x*TS+8,L.exit.y*TS,18,'rgba(120,240,140,.2)');
  ctx.globalCompositeOperation='source-over';
  ctx.restore();
}
// пылинки поверх света
function renderDust(){
  ctx.fillStyle='rgba(210,215,205,.22)';
  for(const p of G.parts)if(p.c==='dust')ctx.fillRect(p.x-G.cam.x,p.y-G.cam.y,1,1);
}

// ============================================================
//                     HUD и экраны
// ============================================================
const AMBER='#ffb46b', CYAN='#7df3e8', DIM='rgba(255,180,110,.55)';
function fmtTC(f){const m=(f/3600)|0,s=((f/60)|0)%60,fr=f%60;
  return pad(m,2)+':'+pad(s,2)+':'+pad(fr,2);}
function renderUI(){
  const s=SC; uctx.setTransform(1,0,0,1,0,0);
  uctx.clearRect(0,0,ui.width,ui.height);
  uctx.scale(s,s);
  const W=VW,H=VH;
  // рамка камеры наблюдения
  uctx.strokeStyle='rgba(255,180,110,.28)'; uctx.lineWidth=1;
  const cl=14;
  [[6,6,1,1],[W-6,6,-1,1],[6,H-6,1,-1],[W-6,H-6,-1,-1]].forEach(([x,y,dx,dy])=>{
    uctx.beginPath();uctx.moveTo(x+dx*cl,y);uctx.lineTo(x,y);uctx.lineTo(x,y+dy*cl);uctx.stroke();});
  if(G.state==='title'){renderTitle();return;}
  if(G.state==='brief'){renderBrief();return;}
  if(G.state==='final'){renderFinal();return;}
  if(G.state!=='play'&&G.state!=='wipe')return;
  const L=G.lvl;
  // шапка
  uctx.font='7px "Press Start 2P",monospace';
  uctx.fillStyle=DIM; uctx.textAlign='left';
  uctx.fillText(L.def.sub+' · УР.'+pad(G.lvlIdx+1,2)+' «'+L.def.name+'»',14,20);
  uctx.textAlign='right';
  if(G.rec.active){uctx.fillStyle=(G.t>>4)%2?'#ff4b3e':'rgba(255,75,62,.3)';
    uctx.fillText('● REC',W-90,20); uctx.fillStyle=CYAN; uctx.fillText(fmtTC(G.lt),W-14,20);}
  else{uctx.fillStyle='rgba(200,205,200,.4)'; uctx.fillText('▶ PLAY',W-90,20);
    uctx.fillStyle=DIM; uctx.fillText(fmtTC(G.lt),W-14,20);}
  uctx.textAlign='left';
  // каналы эхо
  uctx.font='7px "Press Start 2P",monospace';
  uctx.fillStyle=DIM; uctx.fillText('ЭХО',14,H-32);
  for(let i=0;i<L.echoLimit;i++){
    const used=i<G.echoes.length||(G.rec.active&&i===G.echoes.length);
    const recHere=G.rec.active&&i===G.echoes.length;
    uctx.strokeStyle=DIM; uuctxStrokeRect(48+i*18,H-40,12,12);
    if(recHere){uctx.fillStyle=(G.t>>3)%2?CYAN:'rgba(125,243,232,.25)';uctx.fillRect(50+i*18,H-38,8,8);}
    else if(used){uctx.fillStyle=CYAN;uctx.fillRect(50+i*18,H-38,8,8);}
  }
  // полоса записи
  if(G.rec.active){uctx.fillStyle='rgba(125,243,232,.2)';uctx.fillRect(48,H-22,140,4);
    uctx.fillStyle=CYAN;uctx.fillRect(48,H-22,140*G.rec.frames.length/REC_MAX,4);}
  // катушки
  uctx.textAlign='right'; uctx.fillStyle=DIM;
  uctx.fillText('КАТУШКИ '+L.coilsGot+'/'+L.totalCoils,W-14,H-32);
  uctx.textAlign='left';
  // сообщение
  if(G.msgT>0&&G.msg){G.msgT--;
    uctx.font='9px "IBM Plex Mono",monospace'; uctx.textAlign='center';
    uctx.fillStyle='rgba(255,180,110,'+clamp(G.msgT/30,0,1)*.9+')';
    uctx.fillText(G.msg,W/2,H-52); uctx.textAlign='left';}
  // пауза
  if(G.paused){
    uctx.fillStyle='rgba(2,4,6,.78)'; uctx.fillRect(0,0,W,H);
    uctx.textAlign='center';
    uctx.font='12px "Press Start 2P",monospace'; uctx.fillStyle=AMBER;
    uctx.fillText('НАБЛЮДЕНИЕ ПРИОСТАНОВЛЕНО',W/2,H/2-46);
    uctx.font='10px "IBM Plex Mono",monospace'; uctx.fillStyle='rgba(220,215,205,.8)';
    ['E — запись эхо   Q — стереть эхо   R — перезапуск сектора',
     'M — звук: '+(SFX.on?'ВКЛ':'ВЫКЛ')+'   ESC — продолжить',
     '','СМЕРТЕЙ: '+G.deaths].forEach((t,i)=>uctx.fillText(t,W/2,H/2-14+i*18));
    uctx.textAlign='left';
  }
  // шторка-шлюз
  if(G.wipe>0){
    const h2=H/2*G.wipe;
    [[0,'#3a3f45'],[h2-6,'#31363b']].forEach(()=>{});
    uctx.fillStyle='#343940'; uctx.fillRect(0,0,W,h2); uctx.fillRect(0,H-h2,W,h2);
    for(let i=0;i<W/16+1;i++){uctx.fillStyle=i%2?'#c9a13b':'#23262b';
      uctx.fillRect(i*16-((G.t>>2)%16),h2-4,8,4); uctx.fillRect(i*16+((G.t>>2)%16),H-h2,8,4);}
  }
  function uuctxStrokeRect(x,y,w,h){uctx.strokeRect(x+.5,y+.5,w,h);}
}
function renderTitle(){
  const W=VW,H=VH;
  uctx.textAlign='center';
  // глитч-заголовок
  const gx=(Math.random()<.05)?(Math.random()-.5)*6:0;
  uctx.font='44px "Press Start 2P",monospace';
  uctx.fillStyle='rgba(255,60,45,.5)'; uctx.fillText('ЭХО',W/2-3+gx,104);
  uctx.fillStyle='rgba(125,243,232,.5)'; uctx.fillText('ЭХО',W/2+3-gx,104);
  uctx.fillStyle='#e8e2d4'; uctx.fillText('ЭХО',W/2,104);
  uctx.font='8px "Press Start 2P",monospace'; uctx.fillStyle=AMBER;
  uctx.fillText('ЭКСПЕРИМЕНТ №9 · ХРОНОКАМЕРА «ПУЛЬСАР-7»',W/2,128);
  uctx.fillStyle='rgba(200,205,200,.5)'; uctx.font='9px "IBM Plex Mono",monospace';
  uctx.fillText('научно-исследовательский институт темпоральной безопасности',W/2,142);
  // служебная записка
  const bx=W/2-172,by=160;
  uctx.strokeStyle='rgba(255,180,110,.4)'; uctx.strokeRect(bx+.5,by+.5,344,64);
  uctx.fillStyle='rgba(255,214,150,.75)'; uctx.font='9px "IBM Plex Mono",monospace'; uctx.textAlign='left';
  ['СЛУЖЕБНАЯ ЗАПИСЬ №9-041','Объекту разрешено покинуть сектор при условии','успешной демонстрации темпоральной записи.'].forEach((t,i)=>uctx.fillText(t,bx+10,by+15+i*13));
  // печать
  uctx.save(); uctx.translate(W/2+118,192); uctx.rotate(-.18); uctx.globalAlpha=.55;
  uctx.strokeStyle='#c24b3a'; uctx.lineWidth=2; uctx.strokeRect(-44,-16,88,32);
  uctx.strokeRect(-40,-12,80,24);
  uctx.fillStyle='#c24b3a'; uctx.font='8px "Press Start 2P",monospace'; uctx.textAlign='center';
  uctx.fillText('ОТДЕЛ 07',0,-2); uctx.fillText('ДОПУЩЕНО',0,9);
  uctx.restore();
  // выбор уровня
  uctx.textAlign='center';
  if(G.save.unlocked>0){
    uctx.font='8px "Press Start 2P",monospace'; uctx.fillStyle=CYAN;
    const names=['◄','►'];
    uctx.fillText(names[0]+'  СЕКТОР '+pad(G.sel+1,2)+' · '+LEVELS[G.sel].name+'  '+names[1],W/2,248);
    if(JP.has('L')){G.sel=(G.sel+G.save.unlocked)%(G.save.unlocked+1);SFX.recBeep();}
    if(JP.has('R')){G.sel=(G.sel+1)%(G.save.unlocked+1);SFX.recBeep();}
  }
  if((G.t>>4)%2){uctx.font='9px "Press Start 2P",monospace';uctx.fillStyle='#e8e2d4';
    uctx.fillText('[ ENTER ] НАЧАТЬ НАБЛЮДЕНИЕ',W/2,272);}
  uctx.font='8px "IBM Plex Mono",monospace'; uctx.fillStyle='rgba(200,205,200,.4)';
  uctx.fillText('A/D — движение · SPACE — прыжок · E — запись эхо · Q — стереть · R — рестарт · M — звук',W/2,H-8);
  uctx.textAlign='left';
  if(JP.has('OK')){G.lvlIdx=G.sel;G.state='brief';SFX.plate();}
}
function renderBrief(){
  const W=VW,H=VH,d=LEVELS[G.lvlIdx];
  uctx.fillStyle='rgba(2,4,6,.72)';uctx.fillRect(0,0,W,H);
  uctx.textAlign='left';
  uctx.font='16px "Pixelify Sans",monospace';uctx.fillStyle=AMBER;
  uctx.fillText('ПРОТОКОЛ №'+pad(G.lvlIdx+1,2),40,64);
  uctx.font='9px "IBM Plex Mono",monospace';uctx.fillStyle='rgba(200,205,200,.55)';
  uctx.fillText('от '+d.date+' · наблюдатель: отдел 07',40,80);
  uctx.strokeStyle='rgba(255,180,110,.3)';
  uctx.beginPath();uctx.moveTo(40,90);uctx.lineTo(W-40,90);uctx.stroke();
  uctx.fillStyle='#e6dfcf';
  const lines=wrap(d.note,52);
  for(let i=0;i<lines.length;i++)uctx.fillText(lines[i],40,112+i*15);
  uctx.fillStyle=CYAN;
  uctx.fillText('ЦЕЛЬ: достичь выхода. каналов эхо: '+d.echo,40,112+lines.length*15+14);
  if((G.t>>4)%2){
    uctx.fillStyle='#e8e2d4';uctx.font='11px "Pixelify Sans",monospace';
    uctx.fillText('[ ENTER ] ПРОДОЛЖИТЬ',40,H-44);
  }
  uctx.textAlign='left';
}
function wrap(t,n){const w=t.split(' '),r=[];let c='';
  for(const x of w){if((c+' '+x).trim().length>n){r.push(c.trim());c=x;}else c+=' '+x;}
  if(c.trim())r.push(c.trim()); return r;}
function renderFinal(){
  const W=VH&&VW,H=VH;
  uctx.fillStyle='rgba(2,4,6,.85)'; uctx.fillRect(0,0,W,H);
  uctx.textAlign='center';
  uctx.font='16px "Press Start 2P",monospace'; uctx.fillStyle='#e8e2d4';
  uctx.fillText('ЗАПИСЬ ЗАВЕРШЕНА',W/2,56);
  uctx.font='9px "IBM Plex Mono",monospace'; uctx.fillStyle=AMBER;
  const coils=G.save.coils.reduce((a,b)=>a+(b||0),0);
  const time=(G.save.time||0)+G.lt;
  uctx.fillText('СОВМЕСТИМОСТЬ ЗАПИСИ С ОРИГИНАЛОМ: 100%',W/2,86);
  uctx.fillText('ВРЕМЯ НАБЛЮДЕНИЯ: '+fmtTC(time)+'   ПОТЕРИ СИГНАЛА: '+G.save.deaths,W/2,102);
  uctx.fillText('КАТУШКИ: '+coils+' / 24',W/2,118);
  // телетайп финальной строки
  G.finalShown+=(G.state==='final'&&G.finalShown<999)?1:0;
  const full='ОБЪЕКТ ВСЕГДА БЫЛ ЭХО.';
  const shown=full.slice(0,Math.min(full.length,Math.floor(G.finalShown/6)));
  if(G.finalShown%6===0&&shown.length<full.length&&shown.length>0)SFX.recBeep();
  uctx.font='12px "Press Start 2P",monospace'; uctx.fillStyle=CYAN;
  uctx.fillText(shown,W/2,160);
  if(shown.length>=full.length&&(G.t>>4)%2){
    uctx.font='9px "IBM Plex Mono",monospace'; uctx.fillStyle='rgba(200,205,200,.7)';
    uctx.fillText('Наблюдение прекращено. Наблюдателя нет.',W/2,186);
    uctx.font='9px "Press Start 2P",monospace'; uctx.fillStyle='#e8e2d4';
    uctx.fillText('[ ENTER ] — ПЕРЕМОТАТЬ ПЛЁНКУ',W/2,H-40);
    if(JP.has('OK')){G.state='title';G.sel=0;SFX.n(.5,200,.8,.2);}
  }
  uctx.textAlign='left';
}

// ---------- главный цикл ----------
let acc=0,last=performance.now();
function frame(t){
  acc+=Math.min(t-last,100); last=t;
  while(acc>=16.667){ step(); acc-=16.667; }
  renderWorld(); renderDust(); renderUI();
  requestAnimationFrame(frame);
}
loadLevel(0); G.state='title';
requestAnimationFrame(frame);
</script>
</body>
