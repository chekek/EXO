<script>
"use strict";
console.log('ЭХО · сборка 11 (мобильный полный экран) — если видите это, файл обновлён');
/* ============================================================
   ЭХО — эксперимент №9 · НИИ «ПУЛЬСАР» · хронокамера К-7
   Блоки Б (10) + В (5) + 4 warp-сектора · лиминальный слой
   Сборка 11: fullscreen по первому касанию · блокировка
   горизонтали · дробный масштаб на телефонах · iOS home-screen
   ============================================================ */

// ---------- константы ----------
const TS=16, VW=480, VH=270;
const GRAV=.34, JUMPV=-5.9, MAXVX=1.75, ACC=.28, FRIC=.3, MAXFALL=6.5;
const P_W=8, P_H=13;
const PULSE_T=168;   // импульсный шлюз: ~2.8 с
const REC_BASE=150, REC_COIL=150;  // плёнка: 5 с база + 5 с за катушку (запись 30 кадров/с)

// ---------- утилиты ----------
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
function hash(x,y){let h=(x*374761393+y*668265263)|0;h=(h^(h>>13))*1274126177|0;return ((h^(h>>16))>>>0)/4294967295;}
const pad=(n,l)=>String(n).padStart(l,'0');

// ---------- аудио (процедурный синтез) ----------
const SFX={ctx:null,master:null,on:true,
  init(){ if(this.ctx)return; try{
    const C=this.ctx=new (window.AudioContext||window.webkitAudioContext)();
    this.master=C.createGain(); this.master.gain.value=.55; this.master.connect(C.destination);
    const g=C.createGain(); g.gain.value=.05; g.connect(this.master);
    const lp=C.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=160; lp.connect(g);
    [52,104.7].forEach(function(f,i){
      const o=C.createOscillator();o.type=i?'triangle':'sawtooth';o.frequency.value=f;
      const og=C.createGain();og.gain.value=i?.25:.6;o.connect(og);og.connect(lp);o.start();});
    const lfo=C.createOscillator();lfo.frequency.value=.11;
    const lg=C.createGain();lg.gain.value=.02;
    lfo.connect(lg);lg.connect(g.gain);lfo.start();
    const nb=C.createBuffer(1,C.sampleRate*2,C.sampleRate),d=nb.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const ns=C.createBufferSource();ns.buffer=nb;ns.loop=true;
    const bp=C.createBiquadFilter();bp.type='bandpass';bp.frequency.value=280;bp.Q.value=.6;
    const ng=C.createGain();ng.gain.value=.014;ns.connect(bp);bp.connect(ng);ng.connect(this.master);ns.start();
  }catch(e){} },
  t(f0,f1,dur,type,vol,delay){ if(!this.ctx||!this.on)return;
    const C=this.ctx,t0=C.currentTime+(delay||0);
    const o=C.createOscillator(),g=C.createGain();o.type=type||'square';
    o.frequency.setValueAtTime(f0,t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
    g.gain.setValueAtTime(vol,t0);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g);g.connect(this.master);o.start(t0);o.stop(t0+dur+.02); },
  n(dur,f,q,vol,delay){ if(!this.ctx||!this.on)return;
    const C=this.ctx,t0=C.currentTime+(delay||0);
    const b=C.createBuffer(1,Math.max(1,(C.sampleRate*dur)|0),C.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s=C.createBufferSource();s.buffer=b;
    const bp=C.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q;
    const g=C.createGain();g.gain.value=vol;s.connect(bp);bp.connect(g);g.connect(this.master);s.start(t0); },
  jump(){this.t(170,330,.12,'square',.10)},
  land(){this.n(.08,300,1,.12)},
  step(){this.n(.045,900,2,.05)},
  plate(){this.t(880,880,.04,'square',.09);this.t(140,90,.1,'triangle',.12)},
  door(o){this.n(.45,o?400:700,1.2,.14);this.t(o?70:120,o?130:60,.45,'sawtooth',.05)},
  recOn(){this.t(500,1200,.18,'square',.08);this.t(1200,1200,.06,'sine',.06,.16)},
  recBeep(){this.t(1100,1100,.05,'sine',.045)},
  echo(){this.t(1400,300,.3,'sine',.09);this.n(.25,2000,3,.06)},
  echoDie(){for(let i=0;i<5;i++)this.t(200+Math.random()*900,100,.06,'square',.06,i*.03)},
  coil(){this.t(880,880,.09,'sine',.10);this.t(1318,1318,.14,'sine',.08,.07)},
  pulse(){this.t(660,660,.09,'square',.1);this.t(660,660,.09,'square',.1,.14);this.t(880,880,.2,'square',.1,.28)},
  death(){this.t(300,40,.5,'sawtooth',.16);this.n(.4,500,.5,.2)},
  win(){[294,440,587].forEach(function(f,i){this.t(f,f,.22,'triangle',.12,i*.13)},this)},
  deny(){this.t(200,150,.12,'square',.08)},
  slam(){this.n(.5,90,.7,.10);this.t(70,38,.5,'sine',.09)},
  cough(){this.n(.09,700,1.4,.05);this.n(.12,500,1.2,.06,.14);this.n(.08,800,1.5,.04,.32)},
  tapeStop(){this.t(1600,220,.22,'sine',.06);this.n(.12,3000,4,.04)}
};

// ---------- ввод ----------
const Keys={},JP=new Set();
const MAP={ArrowLeft:'L',KeyA:'L',ArrowRight:'R',KeyD:'R',ArrowUp:'J',KeyW:'J',Space:'J',
  KeyE:'E',KeyQ:'Q',KeyR:'RS',KeyM:'M',Escape:'ESC',Enter:'OK',ArrowDown:'D'};
addEventListener('keydown',function(e){const k=MAP[e.code];
  if(k){if(!Keys[k])JP.add(k);Keys[k]=1;e.preventDefault();}SFX.init();});
addEventListener('keyup',function(e){const k=MAP[e.code];if(k)Keys[k]=0;});
addEventListener('blur',function(){
  for(const k in Keys)Keys[k]=0;
  if(typeof G!=='undefined'&&G&&G.state==='play')G.paused=true;});

const isTouch=('ontouchstart' in window);
if(isTouch)document.getElementById('touch').style.display='block';
[['tL','L'],['tR','R'],['tJ','J'],['tE','E'],['tQ','Q'],['tP','ESC']].forEach(function(pair){
  const el=document.getElementById(pair[0]);
  el.addEventListener('pointerdown',function(e){e.preventDefault();e.stopPropagation();SFX.init();
    if(!Keys[pair[1]])JP.add(pair[1]);Keys[pair[1]]=1;});
  el.addEventListener('pointerup',function(){Keys[pair[1]]=0;});
  el.addEventListener('pointerleave',function(){Keys[pair[1]]=0;});
});

  SFX.init();
  if(!e.target.classList.contains('tb'))JP.add('OK');
});

// ---------- мобильный полный экран ----------
// Политика браузеров: requestFullscreen разрешён только из жеста пользователя,
// поэтому fullscreen вешается на ПЕРВОЕ касание/нажатие (оно и так нужно для звука).
const IS_MOBILE=isTouch&&(function(){
  try{return matchMedia('(pointer:coarse)').matches;}catch(e){return false;}})();
const FS_OK=(function(){const el=document.documentElement;
  return !!(el.requestFullscreen||el.webkitRequestFullscreen);})();
function goFullscreen(){
  const el=document.documentElement;
  const fn=el.requestFullscreen||el.webkitRequestFullscreen;
  if(!fn)return;
  try{
    const r=fn.call(el);
    const lock=function(){
      if(screen.orientation&&screen.orientation.lock){
        try{
          const q=screen.orientation.lock('landscape');
          if(q&&q.catch)q.catch(function(){});
        }catch(e){}
      }};
    if(r&&typeof r.then==='function')r.then(lock,lock);else lock();
  }catch(e){}
}
let fsTried=false;
function tryFS(){ if(fsTried)return; fsTried=true; if(IS_MOBILE)goFullscreen(); }
['pointerdown','touchstart','keydown'].forEach(function(ev){
  addEventListener(ev,tryFS,true);   // capture: срабатывает раньше кнопок
});
['fullscreenchange','webkitfullscreenchange','orientationchange'].forEach(function(ev){
  addEventListener(ev,function(){
    setTimeout(resize,80);
    setTimeout(resize,300);   // размеры меняются не мгновенно
  });
});
if(isTouch){
  document.addEventListener('touchmove',function(e){e.preventDefault();},{passive:false});
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('dblclick',function(e){e.preventDefault();});
}

function drawDude(g,x,y,fr,face,pal,alpha){
  g.save();g.globalAlpha=alpha;
  const sp=DUDE[fr]||DUDE.idle;
  for(let r=0;r<sp.length;r++)for(let c=0;c<8;c++){
    const ch=sp[r][c]; if(ch==='.')continue;
    g.fillStyle=pal[ch];
    g.fillRect(x+(face<0?7-c:c),y+r,1,1);
  }
  g.restore();
}

// ============================================================
//     ПОСТРОИТЕЛЬ КАРТ (border() — границы; НЕ frame())

function mkGrid(H,W){const m=[];for(let y=0;y<H;y++)m.push(new Array(W).fill('.'));return m;}
function box(m,x0,y0,x1,y1,c){
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)
    if(m[y]&&m[y][x]!==undefined)m[y][x]=c;}
function border(m){const H=m.length,W=m[0].length;
  box(m,0,0,W-1,1,'#');box(m,0,H-1,W-1,H-1,'#');
  box(m,0,0,0,H-1,'#');box(m,W-1,0,W-1,H-1,'#');}
function join(m){return m.map(function(r){return r.join('')});}

// ---------- загрузка уровня ----------
function loadLevel(i){
  const def=LEVELS[i];
  const rows=def.map;
  const H=rows.length,W=rows[0].length;
  const grid=rows.map(function(r){return r.padEnd(W,'#');});
  const L={def:def,W:W,H:H,grid:grid,doors:[],plates:[],coils:[],spikes:[],acid:[],noise:[],
    platforms:[],lamps:[],echoLimit:def.echo,dark:!!def.dark,ch4t:0,
    spawn:{x:32,y:32},exit:null,coilsGot:0,totalCoils:0};
  for(let x=0;x<W;x++){let y=0;
    while(y<H){const ch=grid[y][x];
      if(ch==='A'||ch==='B'||ch==='C'||ch==='D'){
        let y0=y;const ch2=ch;
        while(y<H&&grid[y][x]===ch2)y++;
        L.doors.push({ch:ch2.charCodeAt(0)-64,x:x,y0:y0,y1:y-1,open:0,prevOpen:0,closing:false});
      } else y++;
    }}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const ch=grid[y][x];
    if(ch>='1'&&ch<='4')L.plates.push({ch:+ch,x:x,y:y,press:0,wasP:0,anim:0});
    else if(ch==='o'){L.coils.push({x:x,y:y,taken:false,ph:hash(x,y)*7});L.totalCoils++;}
    else if(ch==='^')L.spikes.push({x:x,y:y});
    else if(ch==='~')L.acid.push({x:x,y:y,top:!(y>0&&grid[y-1][x]==='~')});
    else if(ch==='@')L.noise.push({x:x,y:y});
    else if(ch==='P')L.spawn={x:x*TS+4,y:y*TS+TS-P_H};
    else if(ch==='F')L.exit={x:x,y:y};
    else if(ch==='*')L.platforms.push({cx:x,cy:y,w:TS*3,h:8,ph:hash(x,y)*6.28,
      py:y*TS,ppy:y*TS,dx:0,dy:0,rope:0});
  }
  L.platforms.forEach(function(p){
    let y=p.cy;
    while(y>0&&grid[y-1][p.cx]!=='#')y--;
    p.rope=(p.cy-y)*TS;});
  const lstep=def.dark?13:6;
  for(let x=3;x<W-2;x+=lstep+((hash(x,7)*3)|0)){
    let last=1e9;
    for(let y=H-1;y>=8;y--){
      if(grid[y][x]==='#'&&grid[y-1][x]!=='#'&&last-y>=9){
        L.lamps.push({x:x*TS+8,y:(y-6)*TS,red:!!def.dark&&hash(x*3,y)>.55,seed:hash(x,y)});
        last=y;
      }
    }
  }
  G.lvl=L;G.echoes=[];G.parts=[];G.lt=0;G.winT=0;G.msgT=0;G.msg=null;G.paused=false;
  G.player={x:L.spawn.x,y:L.spawn.y,vx:0,vy:0,face:1,ground:false,coyote:0,jbuf:0,
    animT:0,onPlat:null,dead:false,deadT:0,stepT:0,w:P_W,h:P_H};
  G.rec={active:false,frames:[],tick:0,beep:0,maxLen:REC_BASE};
  G.cam={x:clamp(L.spawn.x-VW/2,0,Math.max(0,L.W*TS-VW)),y:camY(L.spawn.y)};
  // --- лиминальный слой ---
  L.marks=(G.save.marks[i]||[]).slice(0,10);
  L.coughed=false;
  G.film=null;G.watch=null;G.watchDone=false;G.idleT=0;G.path=[];
  G.filmAt=1300+((Math.random()*4200)|0);
  G.palPlayer=G.save.looped?PAL_E:PAL_P;
  G.palEcho=G.save.looped?PAL_P:PAL_E;
  // --- warp-слой ---
  L.fakes={};
  G.mirror=!!def.mirror;G.flipG=!!def.flip;G.endless=!!def.endless;
  G.wraps=0;G.clones=[];G.cloneQueue=def.clones||0;
  G.warpTo=null;
  if(def.warps)for(const w of def.warps)L.fakes[w.x+','+w.y]={to:w.to,type:w.type};
  if(def.endless){
    L.lamps=[];
    for(let s=0;s<8;s++)L.lamps.push({x:(s*12+6)*TS+8,y:24,red:s===4,seed:.5});
  }
  buildCache();
  msg(def.hint,420);
}
function msg(t,d){G.msg=t;G.msgT=d;}
function camY(py){const worldH=G.lvl.H*TS;
  if(worldH<=VH)return -(VH-worldH)/2;
  return clamp(py-VH*.55,0,worldH-VH);}

// ---------- физика ----------
function solidT(tx,ty){const L=G.lvl;
  if(tx<0||tx>=L.W)return '#';
  if(ty<0)return '#';
  if(ty>=L.H)return '.';
  if(L.fakes&&L.fakes[tx+','+ty])return '.';   // фальш-стена: проходима
  return L.grid[ty][tx]==='#'?'#':'.';}

const overlap=function(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;};
function doorRect(d){const full=(d.y1-d.y0+1)*TS,h=full*(1-d.open);
  return {x:d.x*TS+3,y:(d.y1+1)*TS-h,w:10,h:h};}

function tileCollide(e){
  const L=G.lvl;
  if(e.w===undefined){e.w=P_W;e.h=P_H;}
  e.x+=e.vx;
  let y0=Math.floor(e.y/TS),y1=Math.floor((e.y+e.h-1)/TS);
  if(e.vx>0){const tx=Math.floor((e.x+e.w)/TS);
    for(let ty=y0;ty<=y1;ty++)if(solidT(tx,ty)==='#'){e.x=tx*TS-e.w-0.01;e.vx=0;break;}}
  else if(e.vx<0){const tx=Math.floor(e.x/TS);
    for(let ty=y0;ty<=y1;ty++)if(solidT(tx,ty)==='#'){e.x=(tx+1)*TS+0.01;e.vx=0;break;}}
  for(const d of L.doors){const r=doorRect(d);
    if(r.h>0&&overlap(e,r)){
      if(e.vx>0)e.x=r.x-e.w-0.01; else if(e.vx<0)e.x=r.x+r.w+0.01;
      e.vx=0;}}
  const prevB=e.y+e.h;
  e.y+=e.vy; e.ground=false; e.onPlat=null;
  const x0=Math.floor((e.x+1)/TS),x1=Math.floor((e.x+e.w-1)/TS);
  if(e.vy>0){const ty=Math.floor((e.y+e.h)/TS);
    for(let tx=x0;tx<=x1;tx++){
      const g=(ty>=0&&ty<L.H)?L.grid[ty][tx]:null;
      if(solidT(tx,ty)==='#'||(prevB<=ty*TS+0.01&&g==='=')){
        e.y=ty*TS-e.h; e.vy=0; e.ground=!G.flipG; break; }}}
  else if(e.vy<0){const ty=Math.floor(e.y/TS);
    for(let tx=x0;tx<=x1;tx++)if(solidT(tx,ty)==='#'){
      e.y=(ty+1)*TS+0.01;e.vy=0;
      if(G.flipG)e.ground=true;   // перевёрнутая гравитация: потолок — это пол
      break;}}
  for(const d of L.doors){const r=doorRect(d);
    if(r.h>0&&overlap(e,r)){
      if(e.vy>=0&&e.y+e.h/2<r.y+r.h/2){e.y=r.y-e.h;e.vy=0;e.ground=true;}
      else{e.y=r.y+r.h+0.01;e.vy=Math.max(0,e.vy);}}}
  if(e.vy>=0)for(const p of L.platforms){
    const top=p.py;
    if(e.x+e.w>p.cx*TS-p.w/2&&e.x<p.cx*TS+p.w/2&&
       prevB<=top+2.5&&e.y+e.h>=top){
      e.y=top-e.h;e.vy=0;e.ground=true;e.onPlat=p;}}
}

// ---------- помехи ----------
function entNoise(x,y,w,h){const L=G.lvl;
  const pts=[[x+1,y+3],[x+w-1,y+3],[x+1,y+h-1],[x+w-1,y+h-1]];
  for(let i=0;i<pts.length;i++){
    const tx=Math.floor(pts[i][0]/TS),ty=Math.floor(pts[i][1]/TS);
    if(ty>=0&&ty<L.H&&tx>=0&&tx<L.W&&L.grid[ty][tx]==='@')return true;}
  return false;}

// ---------- запись и эхо ----------
function startRec(){
  const P=G.player,L=G.lvl;
  if(!L.echoLimit){
    msg(L.def.sub==='СЕКТОР В-2'?'СЕКТОР ЭКРАНИРОВАН СВИНЦОМ · ХРОНОКАМЕРА БЕССИЛЬНА'
      :'КАНАЛОВ ЭХО НЕТ · ПЛЁНКА НЕ ЗАПИШЕТСЯ',150);
    SFX.deny();return;}
  if(G.echoes.length>=L.echoLimit){msg('КАНАЛЫ ЗАНЯТЫ · Q — СТЕРЕТЬ ИЛИ ПОДОЖДАТЬ ОКОНЧАНИЯ',150);SFX.deny();return;}
  if(entNoise(P.x,P.y,P_W,P_H)){msg('ПОМЕХИ: ЗДЕСЬ НЕ ЗАПИСЫВАЕТСЯ',150);SFX.deny();return;}
  G.rec={active:true,frames:[],tick:0,beep:0,maxLen:REC_BASE+REC_COIL*L.coilsGot};
  msg('ЗАПИСЬ · ПЛЁНКА '+(G.rec.maxLen/30)+' СЕК',80);
  SFX.recOn();
}
function stopRec(cancel){
  const R=G.rec;
  if(R.active&&!cancel){
    if(R.frames.length>10){
      const f=R.frames;
      G.echoes.push({frames:f,t:0,playing:true,dieT:0,
        x:f[0].x,y:f[0].y,face:f[0].fc,fr:'idle'});
      SFX.echo(); burst(f[0].x+4,f[0].y+6,'#7df3e8',18);
      msg('ЭХО ЗАПИСАНО · '+Math.round(f.length/30)+' СЕК · КАНАЛ '+G.echoes.length,120);
    } else { msg('ЗАПИСЬ СЛИШКОМ КОРОТКАЯ',90); SFX.deny(); }
  }
  G.rec={active:false,frames:[],tick:0,beep:0,maxLen:REC_BASE};
}
function clearEchoes(){
  if(!G.echoes.length&&!G.rec.active)return;
  for(const e of G.echoes)if(!e.dieT){e.dieT=1;burst(e.x+4,e.y+6,'#7df3e8',14);}
  if(G.rec.active)stopRec(true);
  SFX.echoDie(); msg('ЭХО СТЁРТЫ',100);
}
function stepEchoes(){
  const L=G.lvl;
  for(const e of G.echoes){
    if(e.dieT){e.dieT++;continue;}
    if(e.playing){
      e.t+=0.5;
      const i=Math.floor(e.t),f=e.t-i;
      const a=e.frames[i],b=e.frames[Math.min(i+1,e.frames.length-1)];
      if(a&&b){e.x=lerp(a.x,b.x,f);e.y=lerp(a.y,b.y,f);e.face=b.fc;e.fr=b.fr;}
      if(G.lt%3===0)G.parts.push({x:e.x+4,y:e.y+6,vx:(Math.random()-.5)*.3,vy:-.15,life:22,c:'#7df3e8',s:1,g:0});
      // плёнка кончилась: эхо повторило запись — и растворилось
      if(e.t>=e.frames.length-1){e.playing=false;echoEnd(e);continue;}
    }
    if(entNoise(e.x,e.y,P_W,P_H)){echoDie(e);continue;}
    const bx={x:e.x,y:e.y,w:P_W,h:P_H};
    if(G.lt%4===0){
      let dead=false;
      for(const s of L.spikes){if(overlap(bx,{x:s.x*TS+2,y:s.y*TS+6,w:12,h:10})){dead=true;break;}}
      if(!dead){
        const tx=Math.floor((e.x+4)/TS),ty=Math.floor((e.y+P_H-2)/TS);
        if(ty>=0&&ty<L.H&&tx>=0&&tx<L.W&&L.grid[ty][tx]==='~')dead=true;
      }
      if(dead){echoDie(e);continue;}
    }
    for(const d of L.doors){if(d.closing&&overlap(bx,doorRect(d))){echoDie(e);break;}}
  }
  G.echoes=G.echoes.filter(function(e){return !e.dieT||e.dieT<22;});
}
function echoDie(e){ if(e.dieT)return; e.dieT=1; SFX.echoDie(); burst(e.x+4,e.y+6,'#7df3e8',26); }
function echoEnd(e){ if(e.dieT)return; e.dieT=1; SFX.tapeStop(); burst(e.x+4,e.y+6,'#7df3e8',16); }
function burst(x,y,c,n){
  for(let i=0;i<n;i++){const a=Math.random()*6.28,v=.5+Math.random()*1.5;
    G.parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.4,life:20+Math.random()*25,c:c,s:Math.random()<.4?2:1,g:.03});}}

// ---------- главный шаг ----------
function step(){
  G.t++;
  if(G.wipeDir!==0){
    G.wipe+=G.wipeDir*0.045;
    if(G.wipeDir>0&&G.wipe>=1){G.wipe=1;G.wipeDir=0;afterWipe();}
    else if(G.wipeDir<0&&G.wipe<=0){
      G.wipe=0;G.wipeDir=0;
      if(G.state==='wipe')G.state='play';
    }
  }
  if(G.state==='play'){
    if(G.paused){
      if(JP.has('ESC')||JP.has('OK'))G.paused=false;
    } else { G.lt++; stepPlay(); }
  }
  else if(G.state==='title'){
    const n=(G.save.unlocked||0)+1;
    if(JP.has('L')){G.sel=(G.sel+n-1)%n;SFX.recBeep();}
    if(JP.has('R')){G.sel=(G.sel+1)%n;SFX.recBeep();}
    if(JP.has('OK')&&G.wipe===0){G.lvlIdx=G.sel;G.state='brief';SFX.plate();}
  }
  else if(G.state==='brief'){
    if(JP.has('OK')&&G.wipe<0.3){
      loadLevel(G.lvlIdx);G.state='wipe';G.wipe=1;G.wipeDir=-1;SFX.door(true);
    }
  }
  else if(G.state==='final'){
    G.finalShown++;
    const full=(LEVELS[MAIN_COUNT-1].finale)||'ОБЪЕКТ ВСЕГДА БЫЛ ЭХО.';
    const shown=Math.min(full.length,Math.floor(G.finalShown/6));
    if(G.finalShown%6===0&&shown>0&&shown<full.length)SFX.recBeep();
    if(shown>=full.length&&JP.has('OK')&&G.wipe===0){
      G.state='title';G.sel=0;SFX.n(.5,200,.8,.2);
    }
  }
  if(G.tcGlitch>0)G.tcGlitch--;
  stepParts();
  JP.clear();
}

function stepPlay(){
  const L=G.lvl,P=G.player;
  if(P.dead){ P.deadT++;
    if(P.deadT>80){P.dead=false;P.x=L.spawn.x;P.y=L.spawn.y;P.vx=0;P.vy=0;
      G.cam.x=clamp(P.x-VW/2,0,Math.max(0,L.W*TS-VW));
      G.cam.y=camY(P.y);}
    return; }
  if(G.winT){ G.winT++;
    if(G.winT===10)SFX.win();
    if(G.winT>62)startWipe();
    return; }
  if(JP.has('ESC')){G.paused=true;return;}
  // тихая архивная плёнка: пишем весь путь
  if(G.lt%6===0){G.path.push({x:P.x,y:P.y,fc:P.face});
    if(G.path.length>2400)G.path.shift();}
  // движение (в ЗЕРКАЛЕ управление отражено)
  let dir=(Keys.R?1:0)-(Keys.L?1:0);
  if(G.mirror)dir=-dir;
  if(dir!==0){P.vx=clamp(P.vx+dir*ACC,-MAXVX,MAXVX);P.face=dir;}
  else{const f=P.ground?FRIC:.08;P.vx=Math.abs(P.vx)<f?0:P.vx-Math.sign(P.vx)*f;}
  if(P.ground)P.coyote=8;else if(P.coyote>0)P.coyote--;
  if(JP.has('J'))P.jbuf=8;else if(P.jbuf>0)P.jbuf--;
  if(P.jbuf>0&&P.coyote>0){P.vy=G.flipG?5.9:JUMPV;P.coyote=0;P.jbuf=0;SFX.jump();}
  if(!Keys.J&&(G.flipG?P.vy>2:P.vy<-2))P.vy=G.flipG?2:-2;
  P.vy=G.flipG?Math.max(P.vy-GRAV,-MAXFALL):Math.min(P.vy+GRAV,MAXFALL);
  for(const p of L.platforms){
    p.ppy=p.py;
    p.py=p.cy*TS+Math.sin(G.lt*0.02+p.ph)*TS*3;
    p.dy=p.py-p.ppy; p.dx=0;
  }
  if(P.onPlat){const p=P.onPlat;
    if(P.x+P.w>p.cx*TS-p.w/2&&P.x<p.cx*TS+p.w/2&&Math.abs(P.y+P.h-p.py)<4){
      P.x+=p.dx;P.y+=p.dy;} else P.onPlat=null;}
  const wasG=P.ground, wasVy=P.vy;
  tileCollide(P);
  if(P.ground&&!wasG&&Math.abs(wasVy)>2.5){SFX.land();G.shake=Math.min(3,Math.abs(wasVy)*.5);
    for(let i=0;i<5;i++)G.parts.push({x:P.x+Math.random()*8,y:P.y+P_H,vx:(Math.random()-.5),vy:-Math.random()*.5,life:14,c:'#8a8578',s:1,g:.02});}
  if(P.ground&&Math.abs(P.vx)>.6){P.stepT++;if(P.stepT>13){P.stepT=0;SFX.step();}}
  P.animT+=Math.abs(P.vx);
  if(P.y>L.H*TS+80){killPlayer();return;}
  if(JP.has('E')){ if(!G.rec.active)startRec(); else stopRec(false); }
  if(JP.has('Q'))clearEchoes();
  if(JP.has('RS')){loadLevel(G.lvlIdx);msg('СЕКТОР ПЕРЕЗАПУЩЕН',120);return;}
  if(JP.has('M')){SFX.on=!SFX.on;msg(SFX.on?'ЗВУК: ВКЛ':'ЗВУК: ВЫКЛ',90);}
  // запись: длина плёнки = катушки; подбор катушки удлиняет на ходу
  if(G.rec.active){
    G.rec.tick++;
    if(G.rec.tick>=2){G.rec.tick=0;
      G.rec.frames.push({x:P.x,y:P.y,fc:P.face,
        fr:!P.ground?'jump':(Math.abs(P.vx)>.5?(Math.floor(P.animT/6)%2?'runA':'runB'):'idle')});
      if(G.rec.frames.length>=G.rec.maxLen)stopRec(false);}
    G.rec.beep++;
    const warn=G.rec.frames.length>G.rec.maxLen*.8;
    if(G.rec.beep>(warn?18:45)){G.rec.beep=0;SFX.recBeep();}
    if(entNoise(P.x,P.y,P_W,P_H)){msg('ПОМЕХИ: ЗАПИСЬ СОРВАНА',130);stopRec(true);}
  }
  const ch=[false,false,false,false];
  for(const pl of L.plates){
    pl.wasP=pl.press; pl.press=0;
    const r={x:pl.x*TS+2,y:pl.y*TS+9,w:12,h:7};
    if(!P.dead&&overlap({x:P.x,y:P.y,w:P_W,h:P_H},r))pl.press=1;
    for(const e of G.echoes){if(!e.dieT&&overlap({x:e.x,y:e.y,w:P_W,h:P_H},r))pl.press=1;}
    if(pl.press&&!pl.wasP){
      SFX.plate();
      if(pl.ch===4){L.ch4t=PULSE_T;SFX.pulse();msg('ИМПУЛЬС: ШЛЮЗ-4 ОТКРЫТ',90);}
    }
    pl.anim+=((pl.press?1:0)-pl.anim)*.3;
    if(pl.ch!==4&&pl.press)ch[pl.ch-1]=true;
  }
  if(L.ch4t>0){L.ch4t--;ch[3]=true;}
  for(const d of L.doors){
    d.prevOpen=d.open;
    const target=ch[d.ch-1]?1:0;
    if(target>d.open)d.open=Math.min(d.open+.07,1);
    else d.open=Math.max(d.open-.015,target);
    d.closing=d.open<d.prevOpen-1e-9;
    const r=doorRect(d);
    if(d.closing){
      if(!P.dead&&overlap({x:P.x,y:P.y,w:P_W,h:P_H},r))killPlayer();
      for(const e of G.echoes){if(!e.dieT&&overlap({x:e.x,y:e.y,w:P_W,h:P_H},r))echoDie(e);}
    }
    if((d.open>0.02)!==(d.prevOpen>0.02))SFX.door(d.open>0.02);
  }
  stepEchoes();
  for(const c of L.coils){ if(c.taken)continue;
    if(overlap({x:P.x,y:P.y,w:P_W,h:P_H},{x:c.x*TS+2,y:c.y*TS+2,w:12,h:12})){
      c.taken=true;L.coilsGot++;SFX.coil();burst(c.x*TS+8,c.y*TS+8,'#ffcf7a',14);
      if(G.rec.active){G.rec.maxLen+=REC_COIL;msg('КАТУШКА · ПЛЁНКА +5 СЕК',90);}
      else msg('КАТУШКА '+L.coilsGot+'/'+L.totalCoils+' · ПЛЁНКА '+((REC_BASE+REC_COIL*L.coilsGot)/30)+' СЕК',90);}}
  if(!P.dead){
    const bx={x:P.x+1,y:P.y+2,w:P_W-2,h:P_H-2};
    for(const s of L.spikes){if(overlap(bx,{x:s.x*TS+2,y:s.y*TS+6,w:12,h:10})){killPlayer();break;}}
    if(!P.dead){
      const tx=Math.floor((P.x+4)/TS),ty=Math.floor((P.y+P_H-2)/TS);
      if(ty>=0&&ty<L.H&&tx>=0&&tx<L.W&&L.grid[ty][tx]==='~'){
        const fk=L.fakes?L.fakes[tx+','+ty]:null;
        if(fk)enterWarp(fk.to);else killPlayer();
      }
    }
  }
  if(L.exit&&!G.winT&&overlap({x:P.x,y:P.y,w:P_W,h:P_H},{x:L.exit.x*TS-4,y:L.exit.y*TS-8,w:24,h:24})){
    G.winT=1;
    if(G.rec.active)stopRec(true);
    burst(P.x+4,P.y+6,'#ffd27a',20);
  }
  // ---- warp-слой ----
  if(!P.dead&&!G.winT&&L.fakes){
    const key=Math.floor((P.x+4)/TS)+','+Math.floor((P.y+6)/TS);
    const f=L.fakes[key];
    if(f&&f.type==='wall'){enterWarp(f.to);return;}
  }
  stepClones();
  stepEndless();
  stepFilm(); stepWatch();
  const tx2=P.x+P.face*26-VW/2;
  G.cam.x=lerp(G.cam.x,clamp(tx2,0,Math.max(0,L.W*TS-VW)),.1);
  G.cam.y=lerp(G.cam.y,camY(P.y),.12);
  if(G.shake>0)G.shake*=.85;
  if(G.glitch>0)G.glitch--;
  if(L.dark&&!L.coughed&&G.lt>600&&G.lt%420===0&&Math.random()<.5){
    L.coughed=true;SFX.cough();}
  if(G.lt%9===0&&L.lamps.length&&Math.random()<.6){
    const lp=L.lamps[(Math.random()*L.lamps.length)|0];
    G.parts.push({x:lp.x+(Math.random()-.5)*30,y:lp.y+Math.random()*40,vx:(Math.random()-.5)*.12,vy:.06+Math.random()*.05,life:120,c:'dust',s:1,g:0});}
  if(G.lt%14===0){
    const tops=L.acid.filter(function(a){return a.top;});
    if(tops.length){const a=tops[(Math.random()*tops.length)|0];
      G.parts.push({x:a.x*TS+Math.random()*16,y:a.y*TS+13,vx:0,vy:-.25-Math.random()*.2,life:40,c:'#9fe08a',s:1,g:0});}}
}
function killPlayer(){const P=G.player;
  if(P.dead||G.winT)return;
  P.dead=true;P.deadT=0;G.deaths++;G.save.deaths++;G.glitch=50;G.shake=5;SFX.death();
  if(G.rec.active)stopRec(true);
  // смерть стирает эхо: каналы освобождаются
  for(const e of G.echoes)if(!e.dieT){e.dieT=1;burst(e.x+4,e.y+6,'#7df3e8',14);}
  burst(P.x+4,P.y+6,'#e8e2d4',30); msg('СИГНАЛ ПОТЕРЯН · ЭХО СБРОШЕНЫ',80);
  const i=G.lvlIdx,mm=G.save.marks[i]||(G.save.marks[i]=[]);
  if(mm.length>=10)mm.shift();
  mm.push([Math.round(P.x),Math.round(P.y)]);
  saveGame();}
function stepParts(){
  for(const p of G.parts){p.x+=p.vx;p.y+=p.vy;p.vy+=p.g||0;p.life--;}
  G.parts=G.parts.filter(function(p){return p.life>0;});}

// ---------- плёнки прошлых прогонов ----------
function stepFilm(){
  const F=G.film;
  if(!F){
    if(G.lt<G.filmAt||G.watch)return;
    const pool=[];
    for(let k=0;k<G.save.paths.length;k++){
      const p=G.save.paths[k];
      if(p&&p.length>40)pool.push(p);
    }
    if(!pool.length)return;
    const fr=pool[(Math.random()*pool.length)|0];
    const P=G.player;
    G.film={frames:fr,t:0,phase:1,stT:0,fr:'runA',fc:1,
      x:fr[0].x,y:fr[0].y,ox:P.x-fr[0].x,oy:P.y-fr[0].y};
    return;
  }
  if(F.phase===1){
    F.t+=1/6;
    const i=Math.floor(F.t),f=F.t-i;
    const a=F.frames[i],b=F.frames[Math.min(i+1,F.frames.length-1)];
    if(a&&b){F.x=lerp(a.x,b.x,f);F.y=lerp(a.y,b.y,f);F.fc=b.fc;F.fr='runA';}
    else{F.phase=2;F.stT=0;}
    if(F.t>=F.frames.length-1){F.phase=2;F.stT=0;}
  } else if(F.phase===2){
    F.stT++;
    if(F.stT>420){F.phase=3;F.stT=0;SFX.tapeStop();}
  } else {
    F.stT++;
    if(F.stT>26){G.film=null;G.tcGlitch=40;}
  }
}
function drawFilm(){
  const F=G.film;if(!F)return;
  const P=G.player;
  let x=F.x+F.ox,y=F.y+F.oy,al=.3;
  if(F.phase===2){
    F.fc=(P.x<x)?-1:1;F.fr='idle';
    al=.2+.06*Math.sin(G.t*.03);
  } else if(F.phase===3){
    al=Math.max(0,1-F.stT/26)*.3;y-=F.stT*.2;x+=(Math.random()-.5)*3;
  }
  if(G.t%23===0)x+=1;
  const pal={H:'#151a1e',S:'#242b31',R:'#181f24',P:'#12181c',B:'#0e1316'};
  drawDude(ctx,x,y,F.fr||'runA',F.fc||1,pal,al);
}

// ---------- наблюдатель ----------
function stepWatch(){
  const L=G.lvl,P=G.player;
  if(G.watch){
    const w=G.watch;w.t++;
    const dx=Math.abs(P.x-w.px0),dy=Math.abs(P.y-w.py0);
    if(w.t>720||dx>TS*3.5||dy>TS*2){
      G.watch=null;
      SFX.slam();G.tcGlitch=36;G.glitch=Math.max(G.glitch,10);
    }
    return;
  }
  const anyKey=Keys.L||Keys.R||Keys.J||Keys.E||Keys.D;
  if(!anyKey&&!P.dead&&!G.rec.active)G.idleT++;else G.idleT=0;
  if(G.idleT>1700&&!G.watchDone&&G.lvlIdx>=2&&!G.film){
    const dir=P.face<0?1:-1;
    const ty=Math.floor((P.y+P.h)/TS)-1;
    for(let d=10;d>=6;d--){
      const tx=Math.floor((P.x+4)/TS)+dir*d;
      if(tx>1&&tx<L.W-2&&ty>1&&ty<L.H-2&&
         L.grid[ty][tx]==='.'&&L.grid[ty+1][tx]==='#'){
        G.watch={active:true,done:false,t:0,px0:P.x,py0:P.y,
          x:tx*TS+4,y:ty*TS+TS-P_H,face:-dir,lt0:G.lt,t0:G.t};
        G.watchDone=true;
        return;
      }
    }
    G.idleT=1600;
  }
}
function drawWatch(){
  const w=G.watch;if(!w||!w.active)return;
  const L=G.lvl;
  let al=.55;
  if(w.t<24)al=w.t/24*.55;
  if(w.t>660)al=Math.max(0,(720-w.t)/60)*.55;
  let x=w.x;if(G.t%31===0)x+=.8;
  const pal=L.dark?{H:'#c3cdd0',S:'#aab6ba',R:'#8f9ba0',P:'#7d8a8f',B:'#6d7a80'}
                  :{H:'#0a0d10',S:'#0a0d10',R:'#080b0d',P:'#080b0d',B:'#060809'};
  drawDude(ctx,x,w.y,'idle',w.face,pal,al);
}

// ---------- клоны (РАЗМНОЖЕНИЕ) ----------
function stepClones(){
  const P=G.player;
  if(G.cloneQueue>0&&G.t%3===0){
    G.cloneQueue--;
    G.clones.push({x:P.x,y:P.y-2,vx:(Math.random()<.5?-1:1)*(1+Math.random()*1.7),
      vy:-3-Math.random()*3.5,face:1,ground:false,coyote:0,jbuf:0,animT:0,
      onPlat:null,dead:false,deadT:0,stepT:0,w:P_W,h:P_H,
      ai:20+Math.random()*80,mode:'run',alpha:.7+Math.random()*.3,
      pal:Math.random()<.18?PAL_E:null});
    SFX.step();
  }
  for(const c of G.clones){
    c.ai--;
    if(c.ai<=0){
      const r=Math.random();
      if(r<.45){c.mode='run';c.vx=(Math.random()<.5?-1:1)*(1+Math.random()*.9);}
      else if(r<.72){c.mode='jump';c.vx=(Math.random()<.5?-1:1)*1.4;
        if(c.ground)c.vy=JUMPV*.95;}
      else if(r<.87){c.mode='idle';c.vx=0;}
      else{c.mode='watch';c.vx=0;}
      c.ai=30+Math.random()*110;
    }
    if(c.mode==='watch')c.face=(P.x>c.x)?1:-1;
    else if(Math.abs(c.vx)>.1)c.face=c.vx>0?1:-1;
    c.vy=Math.min(c.vy+GRAV,MAXFALL);
    tileCollide(c);
    c.animT+=Math.abs(c.vx);
  }
}
function drawClones(){
  if(!G.clones||!G.clones.length)return;
  for(const c of G.clones){
    let x=c.x;
    if(Math.random()<.03)x+=(Math.random()-.5)*1.5;
    const fr=!c.ground?'jump':(Math.abs(c.vx)>.5?(Math.floor(c.animT/6)%2?'runA':'runB'):'idle');
    drawDude(ctx,x,c.y,fr,c.face,c.pal||PAL_P,c.alpha);
  }
}

// ---------- бесконечный коридор ----------
function stepEndless(){
  const L=G.lvl;if(!L.endless)return;
  const P=G.player,seg=12*TS;
  if(P.x>(L.W-3)*TS){
    P.x-=seg;
    G.cam.x=clamp(G.cam.x-seg,0,Math.max(0,L.W*TS-VW));
    G.wraps++;
  } else if(P.x<2*TS){
    P.x+=seg;
    G.cam.x=clamp(G.cam.x+seg,0,Math.max(0,L.W*TS-VW));
    G.wraps++;
  }
  if(!L.exit&&G.wraps>=3){
    const s=(Math.random()*8)|0;
    L.exit={x:s*12+5,y:8};
    SFX.plate();
  }
}

// ---------- варпы ----------
function enterWarp(to){
  if(G.warpTo!=null||G.winT)return;
  G.warpTo=to; G.retIdx=G.lvlIdx;
  G.glitch=Math.max(G.glitch,60);G.shake=6;
  SFX.echoDie();SFX.slam();SFX.tapeStop();
  msg('СИГНАЛ ПОТЕРЯН... НАЙДЕН',120);
  startWipe();
}

// ---------- переходы ----------
function startWipe(){G.state='wipe';G.wipe=0;G.wipeDir=1;SFX.n(.4,300,1,.15);}
function afterWipe(){
  const L=G.lvl,i=G.lvlIdx;
  G.save.coils[i]=Math.max(G.save.coils[i]||0,L.coilsGot);
  G.save.time=(G.save.time||0)+G.lt;
  if(G.path.length>40){
    let src=G.path;
    if(src.length>300){
      const off=((Math.random()*(src.length-300))|0);
      src=src.slice(off,off+300);
    }
    const st=Math.max(1,Math.ceil(src.length/300));
    const p=[];for(let k=0;k<src.length;k+=st)p.push(src[k]);
    G.save.paths[i]=p;
  }
  // выпали в warp-сектор
  if(G.warpTo!=null){
    G.retIdx=(G.retIdx==null)?0:G.retIdx;
    G.lvlIdx=G.warpTo;
    loadLevel(G.lvlIdx);
    saveGame();
    G.state='play';G.wipe=1;G.wipeDir=-1;
    return;
  }
  // вернулись из warp-сектора — в исходный, с чистого листа
  if(i>=MAIN_COUNT){
    const back=(G.retIdx==null)?0:G.retIdx;
    G.retIdx=null;
    G.lvlIdx=back;
    loadLevel(G.lvlIdx);
    saveGame();
    G.state='play';G.wipe=1;G.wipeDir=-1;
    msg('ЗАПИСЬ ВОССТАНОВЛЕНА · СЕКТОР '+pad(back+1,2),150);
    return;
  }
  if(i+1>=MAIN_COUNT){
    G.save.unlocked=MAIN_COUNT-1;
    G.save.looped=true;
    G.save.completions=(G.save.completions||0)+1;
    saveGame();
    G.state='final';G.finalShown=0;G.wipeDir=-1;SFX.win(); return;}
  G.save.unlocked=Math.max(G.save.unlocked,i+1); saveGame();
  G.lvlIdx=i+1; G.state='brief'; G.wipeDir=-1;
}

function buildCache(){
  const L=G.lvl; if(!L)return;
  lcv.width=L.W*TS; lcv.height=L.H*TS;
  const g=lctx;
  g.clearRect(0,0,lcv.width,lcv.height);
  for(let y=0;y<L.H;y++)for(let x=0;x<L.W;x++){
    const ch=L.grid[y][x],px=x*TS,py=y*TS;
    if(ch==='#'){
      const openTop=y>0?L.grid[y-1][x]!=='#':true;
      if(openTop){
        g.fillStyle='#6f8b86'; g.fillRect(px,py,TS,TS);
        g.fillStyle='#799691';
        g.fillRect(px+1,py+1,6,6); g.fillRect(px+9,py+1,6,6);
        g.fillRect(px+1,py+9,6,6); g.fillRect(px+9,py+9,6,6);
        g.fillStyle='#546d69'; g.fillRect(px+7,py,1,TS); g.fillRect(px,py+7,TS,1);
        g.fillStyle='#93b0aa'; g.fillRect(px,py,TS,2);
        if(hash(x,y)>.6){g.fillStyle='#5c736f';
          g.fillRect(px+((hash(x,y*3)*10)|0)+2,py+((hash(x*3,y)*10)|0)+2,3,2);}
        if(hash(x*2,y)>.87)for(let i=0;i<4;i++){
          g.fillStyle=i%2?'#c9a13b':'#2c2c28';g.fillRect(px+i*4,py,4,3);}
      } else {
        g.fillStyle='#4c4a45'; g.fillRect(px,py,TS,TS);
        for(let i=0;i<5;i++){const h1=hash(x*31+i,y*17+i);
          g.fillStyle=h1>.5?'#54524c':'#44423d';
          g.fillRect(px+((h1*13)|0),py+((hash(x+i,y*7+i)*13)|0),2,2);}
        if(y+1>=L.H||L.grid[y+1][x]!=='#'){g.fillStyle='#33322e';g.fillRect(px,py+TS-2,TS,2);
          if(hash(x,y*5)>.7){g.fillStyle='#3a3833';g.fillRect(px+6,py+TS-2,2,4);}}
        if(x>0&&L.grid[y][x-1]!=='#'){g.fillStyle='#5a5852';g.fillRect(px,py,2,TS);}
        if(x+1<L.W&&L.grid[y][x+1]!=='#'){g.fillStyle='#3b3a36';g.fillRect(px+TS-2,py,2,TS);}
        if(hash(x*7,y*3)>.94){g.fillStyle='rgba(107,138,96,.5)';g.fillRect(px+2,py+9,12,4);}
      }
    } else if(ch==='='){
      g.fillStyle='#6d747c'; g.fillRect(px,py,TS,5);
      g.fillStyle='#494f55';
      for(let i=0;i<4;i++)g.fillRect(px+2+i*4,py+1,2,3);
      g.fillStyle='#8b939b'; g.fillRect(px,py,TS,1);
      g.fillStyle='#3c4147'; g.fillRect(px,py+5,TS,1);
    } else if(ch==='^'){
      g.fillStyle='#23262b'; g.fillRect(px,py+13,TS,3);
      for(let i=0;i<4;i++){const sx=px+i*4;
        g.fillStyle='#9aa3a8';
        g.beginPath();g.moveTo(sx,py+16);g.lineTo(sx+2,py+6);g.lineTo(sx+4,py+16);g.closePath();g.fill();
        g.fillStyle='#c8d0d4';g.fillRect(sx+1,py+9,1,4);}
    }
  }
  // метки потерь: сектор помнит, где терялся сигнал
  if(L.marks&&L.marks.length){
    for(const mk of L.marks){
      const mx=mk[0]+4,my=mk[1]+P_H;
      for(let k=0;k<7;k++){
        const a=hash(mx*7+k,my*13+k)*6.28,r=2+hash(k,mx+my)*5;
        g.fillStyle='rgba(12,10,9,'+(0.16+hash(k*3,mk[0])*0.12).toFixed(3)+')';
        g.beginPath();
        g.arc(mx+Math.cos(a)*r*.7,my+Math.sin(a)*r*.4,1.5+hash(k,mk[1])*2.2,0,7);
        g.fill();
      }
    }
  }
  if(L.def.signs){
    g.save();
    g.font='8px "IBM Plex Mono",monospace';
    for(const s of L.def.signs){
      g.globalAlpha=.6;
      g.fillStyle=hash(s.x,s.y)>.5?'#c24b3a':'#b9b3a4';
      g.fillText(s.t,s.x*TS,s.y*TS);
    }
    g.restore();
  }
}

function drawLight(camX,camYv){
  const L=G.lvl; if(!L)return;
  const amb=L.dark?0.92:0.40;
  const g=lightCtx;
  g.setTransform(1,0,0,1,0,0);
  g.globalCompositeOperation='source-over';
  g.clearRect(0,0,VW,VH);
  g.fillStyle='rgba(3,5,9,'+amb+')'; g.fillRect(0,0,VW,VH);
  g.globalCompositeOperation='destination-out';
  const cut=function(wx,wy,r,s){
    const x=wx-camX,y=wy-camYv;
    if(x<-r||x>VW+r||y<-r||y>VH+r)return;
    const gr=g.createRadialGradient(x,y,2,x,y,r);
    gr.addColorStop(0,'rgba(0,0,0,'+s+')');gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();};
  for(const lp of L.lamps){
    const fl=.85+.15*Math.sin(G.t*.13+lp.seed*20)+(Math.random()<.01?-.4:0);
    cut(lp.x,lp.y+6,lp.red?42:70*fl,lp.red?.8:.95);}
  const P=G.player;
  if(P&&!P.dead)cut(P.x+4,P.y+6,L.dark?54:62,.95);
  for(const e of G.echoes)if(!e.dieT)cut(e.x+4,e.y+6,40,.9);
  if(G.watch&&G.watch.active)cut(G.watch.x+4,G.watch.y+6,46,.9);
  for(const c of L.coils)if(!c.taken)cut(c.x*TS+8,c.y*TS+8,24,.8);
  for(const pl of L.plates)cut(pl.x*TS+8,pl.y*TS+10,20,.7);
  for(const d of L.doors)cut(d.x*TS+8,d.y0*TS-6,18,.7);
  if(L.exit)cut(L.exit.x*TS+8,L.exit.y*TS,32,.85);
  ctx.save();
  if(G.mirror){ctx.translate(VW,0);ctx.scale(-1,1);}   // свет отражается вместе с миром
  ctx.drawImage(lightCv,0,0);
  ctx.globalCompositeOperation='lighter';
  const glow=function(wx,wy,r,c){
    const x=wx-camX,y=wy-camYv;
    if(x<-r||x>VW+r||y<-r||y>VH+r)return;
    const gr=ctx.createRadialGradient(x,y,1,x,y,r);
    gr.addColorStop(0,c);gr.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();};
  for(const lp of L.lamps){
    const f=.7+.3*Math.sin(G.t*.13+lp.seed*20);
    glow(lp.x,lp.y+5,26,lp.red?'rgba(255,60,45,'+(.15*f)+')':'rgba(255,190,110,'+(.13*f)+')');
    ctx.fillStyle=lp.red?'#ff5a45':'#ffd9a0';
    ctx.fillRect(lp.x-camX-2,lp.y-camYv,4,5);
    ctx.fillStyle='#2c3136';
    ctx.fillRect(lp.x-camX-4,lp.y-camYv-2,8,3);}
  for(const c of L.coils)if(!c.taken)glow(c.x*TS+8,c.y*TS+8,14,'rgba(255,200,90,.22)');
  for(const e of G.echoes)if(!e.dieT)glow(e.x+4,e.y+6,16,'rgba(110,240,230,.15)');
  if(L.exit)glow(L.exit.x*TS+8,L.exit.y*TS,18,'rgba(120,240,140,.2)');
  ctx.restore();
  ctx.globalCompositeOperation='source-over';
}

  uctx.fillText('СОВМЕСТИМОСТЬ ЗАПИСИ С ОРИГИНАЛОМ: 100%',W/2,88);
  uctx.fillText('ВРЕМЯ НАБЛЮДЕНИЯ: '+fmtTC(time)+'   ПОТЕРИ СИГНАЛА: '+G.save.deaths,W/2,104);
  uctx.fillText('КАТУШКИ: '+coils+' / '+TOTAL_COILS,W/2,120);
  const comps=Math.max(1,G.save.completions||1);
  let full=(LEVELS[MAIN_COUNT-1].finale)||'ОБЪЕКТ ВСЕГДА БЫЛ ЭХО.';
  if(comps>=3)full='ПЛЁНКА №'+comps+'. ВЫХОДА НЕТ. ЕСТЬ ТОЛЬКО ЗАПИСЬ.';
  else if(comps===2)full='ПЕТЛЯ ЗАМКНУЛАСЬ.';
  const shown=full.slice(0,Math.min(full.length,Math.floor(G.finalShown/6)));
  uctx.font='14px "Pixelify Sans",monospace';uctx.fillStyle=CYAN;
  uctx.fillText(shown,W/2,164);
  if(shown.length>=full.length&&(G.t>>4)%2){
    uctx.font='9px "IBM Plex Mono",monospace';uctx.fillStyle='rgba(200,205,200,.7)';
    uctx.fillText('Наблюдение прекращено. Наблюдателя нет.',W/2,190);
    uctx.font='11px "Pixelify Sans",monospace';uctx.fillStyle='#e8e2d4';
    uctx.fillText('[ ENTER ] — ПЕРЕМОТАТЬ ПЛЁНКУ',W/2,H-40);
  }
  uctx.textAlign='left';
}

// ---------- главный цикл ----------
let acc=0,last=performance.now();
function frame(t){
  acc+=Math.min(t-last,100); last=t;
  while(acc>=16.667){ step(); acc-=16.667; }
  renderWorld(); renderUI();
  requestAnimationFrame(frame);
}
loadLevel(0);
G.state='title';
requestAnimationFrame(frame);
</script>
