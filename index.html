// ---------- аудио (процедурный синтез) ----------
const SFX={ctx:null,master:null,on:true,
  init(){ if(this.ctx)return; try{
    const C=this.ctx=new (window.AudioContext||window.webkitAudioContext)();
    this.master=C.createGain(); this.master.gain.value=.55; this.master.connect(C.destination);
    const g=C.createGain(); g.gain.value=.05; g.connect(this.master);
    const lp=C.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=160; lp.connect(g);
    [52,104.7].forEach(function(f,i){
      const o=C.createOscillator();o.type=i?'triangle':'sawtooth';o.frequency.value=f;
      const og=C.createGain();og.gain.value=i?.25:.6;o.connect(og);og.connect(lp);o.start();});
    const lfo=C.createOscillator();lfo.frequency.value=.11;
    const lg=C.createGain();lg.gain.value=.02;
    lfo.connect(lg);lg.connect(g.gain);lfo.start();
    const nb=C.createBuffer(1,C.sampleRate*2,C.sampleRate),d=nb.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const ns=C.createBufferSource();ns.buffer=nb;ns.loop=true;
    const bp=C.createBiquadFilter();bp.type='bandpass';bp.frequency.value=280;bp.Q.value=.6;
    const ng=C.createGain();ng.gain.value=.014;ns.connect(bp);bp.connect(ng);ng.connect(this.master);ns.start();
  }catch(e){} },
  t(f0,f1,dur,type,vol,delay){ if(!this.ctx||!this.on)return;
    const C=this.ctx,t0=C.currentTime+(delay||0);
    const o=C.createOscillator(),g=C.createGain();o.type=type||'square';
    o.frequency.setValueAtTime(f0,t0);
    o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t0+dur);
    g.gain.setValueAtTime(vol,t0);
    g.gain.exponentialRampToValueAtTime(.0001,t0+dur);
    o.connect(g);g.connect(this.master);o.start(t0);o.stop(t0+dur+.02); },
  n(dur,f,q,vol,delay){ if(!this.ctx||!this.on)return;
    const C=this.ctx,t0=C.currentTime+(delay||0);
    const b=C.createBuffer(1,Math.max(1,(C.sampleRate*dur)|0),C.sampleRate),d=b.getChannelData(0);
    for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(1-i/d.length);
    const s=C.createBufferSource();s.buffer=b;
    const bp=C.createBiquadFilter();bp.type='bandpass';bp.frequency.value=f;bp.Q.value=q;
    const g=C.createGain();g.gain.value=vol;s.connect(bp);bp.connect(g);g.connect(this.master);s.start(t0); },
  jump(){this.t(170,330,.12,'square',.10)},
  land(){this.n(.08,300,1,.12)},
  step(){this.n(.045,900,2,.05)},

  recBeep(){this.t(1100,1100,.05,'sine',.045)},

  pulse(){this.t(660,660,.09,'square',.1);this.t(660,660,.09,'square',.1,.14);this.t(880,880,.2,'square',.1,.28)},
  death(){this.t(300,40,.5,'sawtooth',.16);this.n(.4,500,.5,.2)},
  win(){[294,440,587].forEach(function(f,i){this.t(f,f,.22,'triangle',.12,i*.13)},this)},
  deny(){this.t(200,150,.12,'square',.08)}
};

function drawDude(g,x,y,fr,face,pal,alpha){
  g.save();g.globalAlpha=alpha;
  const sp=DUDE[fr]||DUDE.idle;
  for(let r=0;r<sp.length;r++)for(let c=0;c<8;c++){

function mkGrid(H,W){const m=[];for(let y=0;y<H;y++)m.push(new Array(W).fill('.'));return m;}
function box(m,x0,y0,x1,y1,c){
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++)
    if(m[y]&&m[y][x]!==undefined)m[y][x]=c;}
function border(m){const H=m.length,W=m[0].length;
  box(m,0,0,W-1,1,'#');box(m,0,H-1,W-1,H-1,'#');
  box(m,0,0,0,H-1,'#');box(m,W-1,0,W-1,H-1,'#');}
function join(m){return m.map(function(r){return r.join('')});}

const TOTAL_COILS=LEVELS.reduce(function(a,l){return a+l.map.join('').split('o').length-1;},0);

// ---------- глобальное состояние ----------
const G={state:'title',lvlIdx:0,sel:0,t:0,lt:0,deaths:0,paused:false,
  save:null,lvl:null,echoes:[],parts:[],msg:null,msgT:0,
  wipe:0,wipeDir:0,shake:0,glitch:0,winT:0,finalShown:0,player:null,rec:null,cam:{x:0,y:0}};
(function(){
  let s=null;
  try{s=JSON.parse(localStorage.getItem('echo9')||'null');}catch(e){s=null;}
  if(!s||typeof s!=='object')s={};
  if(typeof s.unlocked!=='number')s.unlocked=0;
  if(!Array.isArray(s.coils))s.coils=[];
  while(s.coils.length<LEVELS.length)s.coils.push(0);

  if(typeof s.time!=='number')s.time=0;
  G.save=s;
})();

// ---------- загрузка уровня ----------
function loadLevel(i){
  const def=LEVELS[i];
  const rows=def.map;
  const H=rows.length,W=rows[0].length;
  const grid=rows.map(function(r){return r.padEnd(W,'#');});
  const L={def:def,W:W,H:H,grid:grid,doors:[],plates:[],coils:[],spikes:[],acid:[],noise:[],
    platforms:[],lamps:[],echoLimit:def.echo,dark:!!def.dark,ch4t:0,
    spawn:{x:32,y:32},exit:null,coilsGot:0,totalCoils:0};
  for(let x=0;x<W;x++){let y=0;
    while(y<H){const ch=grid[y][x];
      if(ch==='A'||ch==='B'||ch==='C'||ch==='D'){
        let y0=y;const ch2=ch;
        while(y<H&&grid[y][x]===ch2)y++;
        L.doors.push({ch:ch2.charCodeAt(0)-64,x:x,y0:y0,y1:y-1,open:0,prevOpen:0,closing:false});
      } else y++;
    }}
  for(let y=0;y<H;y++)for(let x=0;x<W;x++){const ch=grid[y][x];
    if(ch>='1'&&ch<='4')L.plates.push({ch:+ch,x:x,y:y,press:0,wasP:0,anim:0});
    else if(ch==='o'){L.coils.push({x:x,y:y,taken:false,ph:hash(x,y)*7});L.totalCoils++;}
    else if(ch==='^')L.spikes.push({x:x,y:y});
    else if(ch==='~')L.acid.push({x:x,y:y,top:!(y>0&&grid[y-1][x]==='~')});
    else if(ch==='@')L.noise.push({x:x,y:y});
    else if(ch==='P')L.spawn={x:x*TS+4,y:y*TS+TS-P_H};
    else if(ch==='F')L.exit={x:x,y:y};
    else if(ch==='*')L.platforms.push({cx:x,cy:y,w:TS*3,h:8,ph:hash(x,y)*6.28,
      py:y*TS,ppy:y*TS,dx:0,dy:0,rope:0});
  }
  L.platforms.forEach(function(p){
    let y=p.cy;
    while(y>0&&grid[y-1][p.cx]!=='#')y--;
    p.rope=(p.cy-y)*TS;});
  // лампы над этажами
  const lstep=def.dark?13:6;
  for(let x=3;x<W-2;x+=lstep+((hash(x,7)*3)|0)){
    let last=1e9;
    for(let y=H-1;y>=8;y--){
      if(grid[y][x]==='#'&&grid[y-1][x]!=='#'&&last-y>=9){
        L.lamps.push({x:x*TS+8,y:(y-6)*TS,red:!!def.dark&&hash(x*3,y)>.55,seed:hash(x,y)});
        last=y;
      }
    }
  }
  G.lvl=L;G.echoes=[];G.parts=[];G.lt=0;G.winT=0;G.msgT=0;G.msg=null;G.paused=false;
  G.player={x:L.spawn.x,y:L.spawn.y,vx:0,vy:0,face:1,ground:false,coyote:0,jbuf:0,
    animT:0,onPlat:null,dead:false,deadT:0,stepT:0,w:P_W,h:P_H};
  G.rec={active:false,frames:[],tick:0,beep:0};
  G.cam={x:clamp(L.spawn.x-VW/2,0,Math.max(0,L.W*TS-VW)),y:camY(L.spawn.y)};
  buildCache();
  msg(def.hint,420);
}
function msg(t,d){G.msg=t;G.msgT=d;}
function camY(py){const worldH=G.lvl.H*TS;
  if(worldH<=VH)return -(VH-worldH)/2;
  return clamp(py-VH*.55,0,worldH-VH);}

// ---------- физика ----------
function solidT(tx,ty){const L=G.lvl;
  if(tx<0||tx>=L.W)return '#';
  if(ty<0)return '#';
  if(ty>=L.H)return '.';
  return L.grid[ty][tx]==='#'?'#':'.';}

const overlap=function(a,b){return a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;};
function doorRect(d){const full=(d.y1-d.y0+1)*TS,h=full*(1-d.open);
  return {x:d.x*TS+3,y:(d.y1+1)*TS-h,w:10,h:h};}

function tileCollide(e){
  const L=G.lvl;
  if(e.w===undefined){e.w=P_W;e.h=P_H;}
  e.x+=e.vx;
  let y0=Math.floor(e.y/TS),y1=Math.floor((e.y+e.h-1)/TS);
  if(e.vx>0){const tx=Math.floor((e.x+e.w)/TS);
    for(let ty=y0;ty<=y1;ty++)if(solidT(tx,ty)==='#'){e.x=tx*TS-e.w-0.01;e.vx=0;break;}}
  else if(e.vx<0){const tx=Math.floor(e.x/TS);
    for(let ty=y0;ty<=y1;ty++)if(solidT(tx,ty)==='#'){e.x=(tx+1)*TS+0.01;e.vx=0;break;}}
  for(const d of L.doors){const r=doorRect(d);
    if(r.h>0&&overlap(e,r)){
      if(e.vx>0)e.x=r.x-e.w-0.01; else if(e.vx<0)e.x=r.x+r.w+0.01;
      e.vx=0;}}
  const prevB=e.y+e.h;
  e.y+=e.vy; e.ground=false; e.onPlat=null;
  const x0=Math.floor((e.x+1)/TS),x1=Math.floor((e.x+e.w-1)/TS);
  if(e.vy>0){const ty=Math.floor((e.y+e.h)/TS);
    for(let tx=x0;tx<=x1;tx++){
      const g=(ty>=0&&ty<L.H)?L.grid[ty][tx]:null;
      if(solidT(tx,ty)==='#'||(prevB<=ty*TS+0.01&&g==='=')){
        e.y=ty*TS-e.h; e.vy=0; e.ground=true; break; }}}
  else if(e.vy<0){const ty=Math.floor(e.y/TS);
    for(let tx=x0;tx<=x1;tx++)if(solidT(tx,ty)==='#'){e.y=(ty+1)*TS+0.01;e.vy=0;break;}}
  for(const d of L.doors){const r=doorRect(d);
    if(r.h>0&&overlap(e,r)){
      if(e.vy>=0&&e.y+e.h/2<r.y+r.h/2){e.y=r.y-e.h;e.vy=0;e.ground=true;}
      else{e.y=r.y+r.h+0.01;e.vy=Math.max(0,e.vy);}}}
  if(e.vy>=0)for(const p of L.platforms){
    const top=p.py;
    if(e.x+e.w>p.cx*TS-p.w/2&&e.x<p.cx*TS+p.w/2&&
       prevB<=top+2.5&&e.y+e.h>=top){
      e.y=top-e.h;e.vy=0;e.ground=true;e.onPlat=p;}}
}

// ---------- помехи ----------
function entNoise(x,y,w,h){const L=G.lvl;
  const pts=[[x+1,y+3],[x+w-1,y+3],[x+1,y+h-1],[x+w-1,y+h-1]];
  for(let i=0;i<pts.length;i++){
    const tx=Math.floor(pts[i][0]/TS),ty=Math.floor(pts[i][1]/TS);
    if(ty>=0&&ty<L.H&&tx>=0&&tx<L.W&&L.grid[ty][tx]==='@')return true;}
  return false;}

// ---------- запись и эхо ----------
function startRec(){
  const P=G.player,L=G.lvl;
  if(G.echoes.length>=L.echoLimit){msg('КАНАЛЫ ЭХО ЗАНЯТЫ · Q — ОЧИСТИТЬ',150);SFX.deny();return;}
  if(entNoise(P.x,P.y,P_W,P_H)){msg('ПОМЕХИ: ЗДЕСЬ НЕ ЗАПИСЫВАЕТСЯ',150);SFX.deny();return;}
  G.rec={active:true,frames:[],tick:0,beep:0}; SFX.recOn();
}
function stopRec(cancel){
  const R=G.rec;
  if(R.active&&R.frames.length>10&&!cancel){
    const f=R.frames;
    G.echoes.push({frames:f,t:0,playing:true,frozen:false,dieT:0,
      x:f[0].x,y:f[0].y,face:f[0].fc,fr:'idle'});
    SFX.echo(); burst(f[0].x+4,f[0].y+6,'#7df3e8',18);
    msg('ЭХО ЗАПИСАНО · КАНАЛ '+G.echoes.length,120);
  }
  G.rec={active:false,frames:[],tick:0,beep:0};
}
function clearEchoes(){
  if(!G.echoes.length&&!G.rec.active)return;
  for(const e of G.echoes)if(!e.dieT){e.dieT=1;burst(e.x+4,e.y+6,'#7df3e8',14);}
  if(G.rec.active)stopRec(true);
  SFX.echoDie(); msg('ЭХО СТЁРТЫ',100);
}
function stepEchoes(){
  const L=G.lvl;
  for(const e of G.echoes){
    if(e.dieT){e.dieT++;continue;}
    if(e.playing){
      e.t+=0.5;
      const i=Math.floor(e.t),f=e.t-i;
      const a=e.frames[i],b=e.frames[Math.min(i+1,e.frames.length-1)];
      if(a&&b){e.x=lerp(a.x,b.x,f);e.y=lerp(a.y,b.y,f);e.face=b.fc;e.fr=b.fr;}
      if(G.lt%3===0)G.parts.push({x:e.x+4,y:e.y+6,vx:(Math.random()-.5)*.3,vy:-.15,life:22,c:'#7df3e8',s:1,g:0});
      if(e.t>=e.frames.length-1){e.playing=false;e.frozen=true;}
    }
    if(entNoise(e.x,e.y,P_W,P_H)){echoDie(e);continue;}
    const bx={x:e.x,y:e.y,w:P_W,h:P_H};
    if(G.lt%4===0){
      let dead=false;
      for(const s of L.spikes){if(overlap(bx,{x:s.x*TS+2,y:s.y*TS+6,w:12,h:10})){dead=true;break;}}
      if(!dead){
        const tx=Math.floor((e.x+4)/TS),ty=Math.floor((e.y+P_H-2)/TS);
        if(ty>=0&&ty<L.H&&tx>=0&&tx<L.W&&L.grid[ty][tx]==='~')dead=true;
      }
      if(dead){echoDie(e);continue;}
    }
    for(const d of L.doors){if(d.closing&&overlap(bx,doorRect(d))){echoDie(e);break;}}
  }
  G.echoes=G.echoes.filter(function(e){return !e.dieT||e.dieT<22;});
}
function echoDie(e){ if(e.dieT)return; e.dieT=1; SFX.echoDie(); burst(e.x+4,e.y+6,'#7df3e8',26); }
function burst(x,y,c,n){
  for(let i=0;i<n;i++){const a=Math.random()*6.28,v=.5+Math.random()*1.5;
    G.parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-.4,life:20+Math.random()*25,c:c,s:Math.random()<.4?2:1,g:.03});}}

// ---------- главный шаг ----------
function step(){
  G.t++;
  if(G.wipeDir!==0){
    G.wipe+=G.wipeDir*0.045;
    if(G.wipeDir>0&&G.wipe>=1){G.wipe=1;G.wipeDir=0;afterWipe();}
    else if(G.wipeDir<0&&G.wipe<=0){
      G.wipe=0;G.wipeDir=0;
      if(G.state==='wipe')G.state='play';
    }
  }
  if(G.state==='play'){
    if(G.paused){
      if(JP.has('ESC')||JP.has('OK'))G.paused=false;
    } else { G.lt++; stepPlay(); }
  }
  else if(G.state==='title'){
    const n=(G.save.unlocked||0)+1;
    if(JP.has('L')){G.sel=(G.sel+n-1)%n;SFX.recBeep();}
    if(JP.has('R')){G.sel=(G.sel+1)%n;SFX.recBeep();}
    if(JP.has('OK')&&G.wipe===0){G.lvlIdx=G.sel;G.state='brief';SFX.plate();}
  }
  else if(G.state==='brief'){
    if(JP.has('OK')&&G.wipe<0.3){
      loadLevel(G.lvlIdx);G.state='wipe';G.wipe=1;G.wipeDir=-1;SFX.door(true);
    }
  }
  else if(G.state==='final'){
    G.finalShown++;
    const full='ОБЪЕКТ ВСЕГДА БЫЛ ЭХО.';
    const shown=Math.min(full.length,Math.floor(G.finalShown/6));
    if(G.finalShown%6===0&&shown>0&&shown<full.length)SFX.recBeep();
    if(shown>=full.length&&JP.has('OK')&&G.wipe===0){
      G.state='title';G.sel=0;SFX.n(.5,200,.8,.2);
    }
  }
  stepParts();
  JP.clear();
}

function stepPlay(){
  const L=G.lvl,P=G.player;
  if(P.dead){ P.deadT++;
    if(P.deadT>80){P.dead=false;P.x=L.spawn.x;P.y=L.spawn.y;P.vx=0;P.vy=0;
      G.cam.x=clamp(P.x-VW/2,0,Math.max(0,L.W*TS-VW));
      G.cam.y=camY(P.y);}
    return; }
  if(G.winT){ G.winT++;
    if(G.winT===10)SFX.win();
    if(G.winT>62)startWipe();
    return; }
  if(JP.has('ESC')){G.paused=true;return;}
  const dir=(Keys.R?1:0)-(Keys.L?1:0);
  if(dir!==0){P.vx=clamp(P.vx+dir*ACC,-MAXVX,MAXVX);P.face=dir;}
  else{const f=P.ground?FRIC:.08;P.vx=Math.abs(P.vx)<f?0:P.vx-Math.sign(P.vx)*f;}
  if(P.ground)P.coyote=8;else if(P.coyote>0)P.coyote--;
  if(JP.has('J'))P.jbuf=8;else if(P.jbuf>0)P.jbuf--;
  if(P.jbuf>0&&P.coyote>0){P.vy=JUMPV;P.coyote=0;P.jbuf=0;SFX.jump();}
  if(!Keys.J&&P.vy<-2)P.vy=-2;
  P.vy=Math.min(P.vy+GRAV,MAXFALL);
  for(const p of L.platforms){
    p.ppy=p.py;
    p.py=p.cy*TS+Math.sin(G.lt*0.02+p.ph)*TS*3;
    p.dy=p.py-p.ppy; p.dx=0;
  }
  if(P.onPlat){const p=P.onPlat;
    if(P.x+P.w>p.cx*TS-p.w/2&&P.x<p.cx*TS+p.w/2&&Math.abs(P.y+P.h-p.py)<4){
      P.x+=p.dx;P.y+=p.dy;} else P.onPlat=null;}
  const wasG=P.ground, wasVy=P.vy;
  tileCollide(P);
  if(P.ground&&!wasG&&wasVy>2.5){SFX.land();G.shake=Math.min(3,wasVy*.5);
    for(let i=0;i<5;i++)G.parts.push({x:P.x+Math.random()*8,y:P.y+P_H,vx:(Math.random()-.5),vy:-Math.random()*.5,life:14,c:'#8a8578',s:1,g:.02});}
  if(P.ground&&Math.abs(P.vx)>.6){P.stepT++;if(P.stepT>13){P.stepT=0;SFX.step();}}
  P.animT+=Math.abs(P.vx);
  if(P.y>L.H*TS+80){killPlayer();return;}
  if(JP.has('E')){ if(!G.rec.active)startRec(); else stopRec(false); }
  if(JP.has('Q'))clearEchoes();
  if(JP.has('RS')){loadLevel(G.lvlIdx);msg('СЕКТОР ПЕРЕЗАПУЩЕН',120);return;}
  if(JP.has('M')){SFX.on=!SFX.on;msg(SFX.on?'ЗВУК: ВКЛ':'ЗВУК: ВЫКЛ',90);}
  if(G.rec.active){
    G.rec.tick++;
    if(G.rec.tick>=2){G.rec.tick=0;
      G.rec.frames.push({x:P.x,y:P.y,fc:P.face,
        fr:!P.ground?'jump':(Math.abs(P.vx)>.5?(Math.floor(P.animT/6)%2?'runA':'runB'):'idle')});
      if(G.rec.frames.length>=REC_MAX)stopRec(false);}
    G.rec.beep++;
    if(G.rec.beep>45){G.rec.beep=0;SFX.recBeep();}
    if(entNoise(P.x,P.y,P_W,P_H)){msg('ПОМЕХИ: ЗАПИСЬ СОРВАНА',130);stopRec(true);}
  }
  const ch=[false,false,false,false];
  for(const pl of L.plates){
    pl.wasP=pl.press; pl.press=0;
    const r={x:pl.x*TS+2,y:pl.y*TS+9,w:12,h:7};
    if(!P.dead&&overlap({x:P.x,y:P.y,w:P_W,h:P_H},r))pl.press=1;
    for(const e of G.echoes){if(!e.dieT&&overlap({x:e.x,y:e.y,w:P_W,h:P_H},r))pl.press=1;}
    if(pl.press&&!pl.wasP){
      SFX.plate();
      if(pl.ch===4){L.ch4t=PULSE_T;SFX.pulse();msg('ИМПУЛЬС: ШЛЮЗ-4 ОТКРЫТ',90);}
    }
    pl.anim+=((pl.press?1:0)-pl.anim)*.3;
    if(pl.ch!==4&&pl.press)ch[pl.ch-1]=true;
  }
  if(L.ch4t>0){L.ch4t--;ch[3]=true;}
  for(const d of L.doors){
    d.prevOpen=d.open;
    const target=ch[d.ch-1]?1:0;
    if(target>d.open)d.open=Math.min(d.open+.07,1);
    else d.open=Math.max(d.open-.015,target);
    d.closing=d.open<d.prevOpen-1e-9;
    const r=doorRect(d);
    if(d.closing){
      if(!P.dead&&overlap({x:P.x,y:P.y,w:P_W,h:P_H},r))killPlayer();
      for(const e of G.echoes){if(!e.dieT&&overlap({x:e.x,y:e.y,w:P_W,h:P_H},r))echoDie(e);}
    }
    if((d.open>0.02)!==(d.prevOpen>0.02))SFX.door(d.open>0.02);
  }
  stepEchoes();
  for(const c of L.coils){ if(c.taken)continue;
    if(overlap({x:P.x,y:P.y,w:P_W,h:P_H},{x:c.x*TS+2,y:c.y*TS+2,w:12,h:12})){
      c.taken=true;L.coilsGot++;SFX.coil();burst(c.x*TS+8,c.y*TS+8,'#ffcf7a',14);
      msg('КАТУШКА '+L.coilsGot+' / '+L.totalCoils,90);}}
  if(!P.dead){
    const bx={x:P.x+1,y:P.y+2,w:P_W-2,h:P_H-2};
    for(const s of L.spikes){if(overlap(bx,{x:s.x*TS+2,y:s.y*TS+6,w:12,h:10})){killPlayer();break;}}
    if(!P.dead){
      const tx=Math.floor((P.x+4)/TS),ty=Math.floor((P.y+P_H-2)/TS);
      if(ty>=0&&ty<L.H&&tx>=0&&tx<L.W&&L.grid[ty][tx]==='~')killPlayer();
    }
  }

function drawLight(camX,camYv){
  const L=G.lvl; if(!L)return;
  const amb=L.dark?0.92:0.40;
  const g=lightCtx;
  g.setTransform(1,0,0,1,0,0);
  g.globalCompositeOperation='source-over';
  g.clearRect(0,0,VW,VH);
  g.fillStyle='rgba(3,5,9,'+amb+')'; g.fillRect(0,0,VW,VH);
  g.globalCompositeOperation='destination-out';
  const cut=function(wx,wy,r,s){
    const x=wx-camX,y=wy-camYv;
    if(x<-r||x>VW+r||y<-r||y>VH+r)return;
    const gr=g.createRadialGradient(x,y,2,x,y,r);
    gr.addColorStop(0,'rgba(0,0,0,'+s+')');gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr;g.beginPath();g.arc(x,y,r,0,7);g.fill();};
  for(const lp of L.lamps){
    const fl=.85+.15*Math.sin(G.t*.13+lp.seed*20)+(Math.random()<.01?-.4:0);
    cut(lp.x,lp.y+6,lp.red?42:70*fl,lp.red?.8:.95);}
  const P=G.player;
  if(P&&!P.dead)cut(P.x+4,P.y+6,L.dark?54:62,.95);
  for(const e of G.echoes)if(!e.dieT)cut(e.x+4,e.y+6,40,.9);
  for(const c of L.coils)if(!c.taken)cut(c.x*TS+8,c.y*TS+8,24,.8);
  for(const pl of L.plates)cut(pl.x*TS+8,pl.y*TS+10,20,.7);
  for(const d of L.doors)cut(d.x*TS+8,d.y0*TS-6,18,.7);
  if(L.exit)cut(L.exit.x*TS+8,L.exit.y*TS,32,.85);
  ctx.drawImage(lightCv,0,0);
  ctx.globalCompositeOperation='lighter';
  const glow=function(wx,wy,r,c){
    const x=wx-camX,y=wy-camYv;
    if(x<-r||x>VW+r||y<-r||y>VH+r)return;
    const gr=ctx.createRadialGradient(x,y,1,x,y,r);
    gr.addColorStop(0,c);gr.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill();};
  for(const lp of L.lamps){
    const f=.7+.3*Math.sin(G.t*.13+lp.seed*20);
    glow(lp.x,lp.y+5,26,lp.red?'rgba(255,60,45,'+(.15*f)+')':'rgba(255,190,110,'+(.13*f)+')');
    ctx.fillStyle=lp.red?'#ff5a45':'#ffd9a0';
    ctx.fillRect(lp.x-camX-2,lp.y-camYv,4,5);
    ctx.fillStyle='#2c3136';
    ctx.fillRect(lp.x-camX-4,lp.y-camYv-2,8,3);}
  for(const c of L.coils)if(!c.taken)glow(c.x*TS+8,c.y*TS+8,14,'rgba(255,200,90,.22)');
  for(const e of G.echoes)if(!e.dieT)glow(e.x+4,e.y+6,16,'rgba(110,240,230,.15)');
  if(L.exit)glow(L.exit.x*TS+8,L.exit.y*TS,18,'rgba(120,240,140,.2)');
  ctx.globalCompositeOperation='source-over';
}
function renderDust(camX,camYv){
  ctx.fillStyle='rgba(210,215,205,.22)';
  for(const p of G.parts)if(p.c==='dust')ctx.fillRect(p.x-camX,p.y-camYv,1,1);
}

// ============================================================
//                     HUD и экраны
// ============================================================
const AMBER='#ffb46b', CYAN='#7df3e8', DIM='rgba(255,180,110,.55)';
function fmtTC(f){const m=(f/3600)|0,s=((f/60)|0)%60,fr=f%60;
  return pad(m,2)+':'+pad(s,2)+':'+pad(fr,2);}

function renderUI(){
  uctx.setTransform(1,0,0,1,0,0);
  uctx.clearRect(0,0,ui.width,ui.height);
  uctx.scale(SC,SC);
  uctx.strokeStyle='rgba(255,180,110,.28)'; uctx.lineWidth=1;
  const cl=14,W=VW,H=VH;
  const corners=[[6,6,1,1],[W-6,6,-1,1],[6,H-6,1,-1],[W-6,H-6,-1,-1]];
  for(const c of corners){
    uctx.beginPath();
    uctx.moveTo(c[0]+c[2]*cl,c[1]);uctx.lineTo(c[0],c[1]);
    uctx.lineTo(c[0],c[1]+c[3]*cl);uctx.stroke();}
  if(G.state==='title')renderTitle();
  else if(G.state==='brief')renderBrief();
  else if(G.state==='final')renderFinal();
  else if(G.state==='play'||G.state==='wipe')renderHUD();
  if(G.wipe>0)drawWipe();
}
function drawWipe(){
  const W=VW,H=VH,h2=H/2*G.wipe;
  uctx.fillStyle='#343940';
  uctx.fillRect(0,0,W,h2);uctx.fillRect(0,H-h2,W,h2);
  for(let i=0;i<W/16+1;i++){
    uctx.fillStyle=i%2?'#c9a13b':'#23262b';
    uctx.fillRect(i*16-((G.t>>2)%16),h2-4,8,4);
    uctx.fillRect(i*16+((G.t>>2)%16),H-h2,8,4);
  }
}
function renderHUD(){
  const L=G.lvl,W=VW,H=VH;
  uctx.textAlign='left';
  uctx.font='11px "Pixelify Sans",monospace';
  uctx.fillStyle=DIM;
  uctx.fillText(L.def.sub+' · СЕКТОР '+pad(G.lvlIdx+1,2)+' · '+L.def.name,14,22);
  uctx.textAlign='right';
  if(G.rec.active){
    uctx.fillStyle=(G.t>>4)%2?'#ff4b3e':'rgba(255,75,62,.35)';
    uctx.fillText('● REC',W-96,22);
    uctx.fillStyle=CYAN;uctx.fillText(fmtTC(G.lt),W-14,22);
  }else{
    uctx.fillStyle='rgba(200,205,200,.45)';uctx.fillText('▶ PLAY',W-96,22);
    uctx.fillStyle=DIM;uctx.fillText(fmtTC(G.lt),W-14,22);
  }
  uctx.textAlign='left';
  uctx.fillStyle=DIM;uctx.fillText('ЭХО',14,H-28);
  for(let i=0;i<L.echoLimit;i++){
    const used=i<G.echoes.length;
    const recHere=G.rec.active&&i===G.echoes.length;
    uctx.strokeStyle=DIM;
    uctx.strokeRect(52+i*20+.5,H-40+.5,13,13);
    if(recHere){uctx.fillStyle=(G.t>>3)%2?CYAN:'rgba(125,243,232,.25)';uctx.fillRect(54+i*20,H-38,9,9);}
    else if(used){uctx.fillStyle=CYAN;uctx.fillRect(54+i*20,H-38,9,9);}
  }
  if(G.rec.active){
    uctx.fillStyle='rgba(125,243,232,.2)';uctx.fillRect(52,H-22,140,4);
    uctx.fillStyle=CYAN;
    uctx.fillRect(52,H-22,140*Math.min(1,G.rec.frames.length/REC_MAX),4);
  }
  uctx.textAlign='right';uctx.fillStyle=DIM;
  uctx.fillText('КАТУШКИ '+L.coilsGot+'/'+L.totalCoils,W-14,H-28);
  uctx.textAlign='left';
  if(G.state==='play'&&!G.paused&&G.player&&!G.player.dead&&
     entNoise(G.player.x,G.player.y,P_W,P_H)&&(G.t>>3)%2){
    uctx.font='11px "Pixelify Sans",monospace';
    uctx.fillStyle='#8fd6ff';
    uctx.textAlign='center';uctx.fillText('~ ПОМЕХИ ~',W/2,22);uctx.textAlign='left';
  }
  if(G.msgT>0&&G.msg){G.msgT--;
    uctx.font='10px "IBM Plex Mono",monospace';
    uctx.textAlign='center';
    uctx.fillStyle='rgba(255,190,120,'+(clamp(G.msgT/30,0,1)*.95).toFixed(3)+')';
    uctx.fillText(G.msg,W/2,H-52);
    uctx.textAlign='left';}
  if(G.paused){
    uctx.fillStyle='rgba(2,4,6,.78)'; uctx.fillRect(0,0,W,H);
    uctx.textAlign='center';
    uctx.font='15px "Pixelify Sans",monospace';uctx.fillStyle=AMBER;
    uctx.fillText('НАБЛЮДЕНИЕ ПРИОСТАНОВЛЕНО',W/2,H/2-46);
    uctx.font='10px "IBM Plex Mono",monospace';uctx.fillStyle='rgba(220,215,205,.8)';
    const lines=['E — запись эхо · Q — стереть эхо · R — перезапуск сектора',
      'M — звук: '+(SFX.on?'ВКЛ':'ВЫКЛ')+' · ESC — продолжить',
      '','СМЕРТЕЙ ЗА СЕССИЮ: '+G.deaths];
    for(let i=0;i<lines.length;i++)uctx.fillText(lines[i],W/2,H/2-14+i*18);
    uctx.textAlign='left';
  }
}
function renderTitle(){
  const W=VW,H=VH;
  uctx.textAlign='center';
  const gx=(Math.random()<.05)?(Math.random()-.5)*6:0;
  uctx.font='64px "Pixelify Sans",monospace';
  uctx.fillStyle='rgba(255,60,45,.45)';uctx.fillText('ЭХО',W/2-3+gx,102);
  uctx.fillStyle='rgba(125,243,232,.45)';uctx.fillText('ЭХО',W/2+3-gx,102);
  uctx.fillStyle='#e8e2d4';uctx.fillText('ЭХО',W/2+gx*.5,102);
  uctx.font='12px "Pixelify Sans",monospace';uctx.fillStyle=AMBER;
  uctx.fillText('ЭКСПЕРИМЕНТ №9 · ХРОНОКАМЕРА «ПУЛЬСАР-7»',W/2,128);
  uctx.font='9px "IBM Plex Mono",monospace';uctx.fillStyle='rgba(200,205,200,.5)';
  uctx.fillText('научно-исследовательский институт темпоральной безопасности',W/2,142);
  const bx=W/2-176,by=158;
  uctx.strokeStyle='rgba(255,180,110,.4)';
  uctx.strokeRect(bx+.5,by+.5,352,58);
  uctx.fillStyle='rgba(255,214,150,.75)';
  uctx.font='9px "IBM Plex Mono",monospace';
  uctx.textAlign='left';
  const note=['СЛУЖЕБНАЯ ЗАПИСЬ №9-041',
    'Объекту разрешено покинуть сектор при условии',
    'успешной демонстрации темпоральной записи.'];
  for(let i=0;i<note.length;i++)uctx.fillText(note[i],bx+10,by+15+i*13);
  uctx.save();
  uctx.translate(W/2+118,192); uctx.rotate(-.18); uctx.globalAlpha=.55;
  uctx.strokeStyle='#c24b3a'; uctx.lineWidth=2;
  uctx.strokeRect(-44,-16,88,32); uctx.strokeRect(-40,-12,80,24);
  uctx.fillStyle='#c24b3a';
  uctx.font='10px "Pixelify Sans",monospace';uctx.textAlign='center';
  uctx.fillText('ОТДЕЛ 07',0,-2); uctx.fillText('ДОПУЩЕНО',0,10);
  uctx.restore();
  uctx.textAlign='center';
  if((G.save.unlocked||0)>0){
    uctx.font='11px "Pixelify Sans",monospace';uctx.fillStyle=CYAN;
    uctx.fillText('◄  СЕКТОР '+pad(G.sel+1,2)+' · '+LEVELS[G.sel].name+'  ►',W/2,246);
  }
  if((G.t>>4)%2){
    uctx.font='11px "Pixelify Sans",monospace';uctx.fillStyle='#e8e2d4';
    uctx.fillText('[ ENTER ] НАЧАТЬ НАБЛЮДЕНИЕ',W/2,270);
  }
  uctx.font='8px "IBM Plex Mono",monospace';uctx.fillStyle='rgba(200,205,200,.4)';
  uctx.fillText('A/D — движение · SPACE — прыжок · E — запись эхо · Q — стереть · R — рестарт · M — звук · сборка 4',W/2,H-6);
  uctx.textAlign='left';
}
function renderBrief(){
  const W=VW,H=VH,d=LEVELS[G.lvlIdx];
  uctx.fillStyle='rgba(2,4,6,.72)'; uctx.fillRect(0,0,W,H);
  uctx.textAlign='left';
  uctx.font='16px "Pixelify Sans",monospace';uctx.fillStyle=AMBER;
  uctx.fillText('ПРОТОКОЛ №'+pad(G.lvlIdx+1,2),40,64);
  uctx.font='9px "IBM Plex Mono",monospace';uctx.fillStyle='rgba(200,205,200,.55)';
  uctx.fillText('от '+d.date+' · наблюдатель: отдел 07',40,80);
  uctx.strokeStyle='rgba(255,180,110,.3)';
  uctx.beginPath();uctx.moveTo(40,90);uctx.lineTo(W-40,90);uctx.stroke();
  uctx.fillStyle='#e6dfcf';
  const lines=wrap(d.note,52);
  for(let i=0;i<lines.length;i++)uctx.fillText(lines[i],40,112+i*15);
  uctx.fillStyle=CYAN;
  uctx.fillText('ЦЕЛЬ: достичь выхода. каналов эхо: '+d.echo,40,112+lines.length*15+14);
  if((G.t>>4)%2){
    uctx.fillStyle='#e8e2d4';
    uctx.font='11px "Pixelify Sans",monospace';
    uctx.fillText('[ ENTER ] ПРОДОЛЖИТЬ',40,H-44);
  }
  uctx.textAlign='left';
}
function wrap(t,n){
  const w=t.split(' '),r=[];let c='';
  for(const x of w){
    if((c+' '+x).trim().length>n){r.push(c.trim());c=x;}
    else c+=' '+x;}
  if(c.trim())r.push(c.trim());
  return r;}
function renderFinal(){
  const W=VW,H=VH;
  uctx.fillStyle='rgba(2,4,6,.85)'; uctx.fillRect(0,0,W,H);
  uctx.textAlign='center';
  uctx.font='18px "Pixelify Sans",monospace';uctx.fillStyle='#e8e2d4';
  uctx.fillText('ЗАПИСЬ ЗАВЕРШЕНА',W/2,56);
  uctx.font='9px "IBM Plex Mono",monospace';uctx.fillStyle=AMBER;
  const coils=G.save.coils.reduce(function(a,b){return a+(b||0);},0);
  const time=(G.save.time||0)+G.lt;
  uctx.fillText('СОВМЕСТИМОСТЬ ЗАПИСИ С ОРИГИНАЛОМ: 100%',W/2,88);
  uctx.fillText('ВРЕМЯ НАБЛЮДЕНИЯ: '+fmtTC(time)+'   ПОТЕРИ СИГНАЛА: '+G.save.deaths,W/2,104);
  uctx.fillText('КАТУШКИ: '+coils+' / '+TOTAL_COILS,W/2,120);
  const full='ОБЪЕКТ ВСЕГДА БЫЛ ЭХО.';
  const shown=full.slice(0,Math.min(full.length,Math.floor(G.finalShown/6)));
  uctx.font='14px "Pixelify Sans",monospace';uctx.fillStyle=CYAN;
  uctx.fillText(shown,W/2,164);
  if(shown.length>=full.length&&(G.t>>4)%2){
    uctx.font='9px "IBM Plex Mono",monospace';uctx.fillStyle='rgba(200,205,200,.7)';
    uctx.fillText('Наблюдение прекращено. Наблюдателя нет.',W/2,190);
    uctx.font='11px "Pixelify Sans",monospace';uctx.fillStyle='#e8e2d4';
    uctx.fillText('[ ENTER ] — ПЕРЕМОТАТЬ ПЛЁНКУ',W/2,H-40);
  }
  uctx.textAlign='left';
}

// ---------- главный цикл ----------
let acc=0,last=performance.now();
function frame(t){
  acc+=Math.min(t-last,100); last=t;
  while(acc>=16.667){ step(); acc-=16.667; }
  renderWorld(); renderUI();
  requestAnimationFrame(frame);
}
loadLevel(0);
G.state='title';
requestAnimationFrame(frame);
</script>
